<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>One avatar, five backgrounds</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1.25rem; background: #101114; color: #eee; }
    h1 { font-size: 1.2rem; margin: 0 0 .25rem; }
    p.sub { margin: 0 0 1rem; color: #aaa; font-size: .9rem; }
    #grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; max-width: 1100px; }
    .cell { background: #1b1d22; border-radius: 12px; padding: .75rem; }
    .stage { position: relative; aspect-ratio: 1 / 1; background: #000; border-radius: 8px; overflow: hidden; }
    .stage video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .stage .ref { position: absolute; right: .5rem; bottom: .5rem; width: 20%; border: 2px solid #fff8; border-radius: 6px; }
    .meta { display: flex; justify-content: space-between; align-items: center; margin-top: .5rem; font-size: .9rem; }
    .ids { font: .7rem ui-monospace, monospace; color: #8a8f99; margin-top: .25rem; word-break: break-all; }
    .status { color: #8ad; } .status.ok { color: #6d6; } .status.bad { color: #f77; }
    .row { display: flex; gap: .5rem; margin: 1rem 0; max-width: 700px; }
    input { flex: 1; padding: .5rem; border-radius: 6px; border: 1px solid #444; background: #1b1d22; color: #eee; }
    button { padding: .45rem .8rem; border-radius: 6px; border: 0; background: #3b6cf6; color: #fff; cursor: pointer; }
    button.small { background: #444; padding: .25rem .6rem; font-size: .8rem; }
  </style>
</head>
<body>
  <h1>One avatar, five backgrounds</h1>
  <p class="sub">Every cell uses the same Face item. Only the background differs. Five live sessions run on this page: four background images and one flat color.</p>
  <div class="row">
    <input id="msg" placeholder="Type a line and send it to all five avatars…" />
    <button id="say">Speak to all</button>
  </div>
  <div id="grid"></div>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" integrity="sha384-2huaZvOR9iDzHqslqwpR87isEmrfxqyWOF7hr7BY6KG0+hVKLoEXMPUJw3ynWuhO" crossorigin="anonymous"></script>
  <script type="module" src="/page.js"></script>
</body>
</html>
