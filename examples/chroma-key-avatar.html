<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kaltura Intelligent Agents — Chroma-key Avatar demo</title>
  <style>body{font-family:system-ui;margin:2rem;max-width:720px} #composited{width:512px;height:512px;background:#0a3d1c repeating-linear-gradient(45deg,#0a3d1c 0,#0a3d1c 10px,#0c4a22 10px,#0c4a22 20px);border-radius:12px;overflow:hidden} #composited canvas{width:100%;height:100%;display:block;transform-origin:0 0} #source{position:absolute;left:-9999px;width:512px;height:512px;object-fit:cover} #cc{color:#a00;font-size:.9rem}</style>
</head>
<body>
  <h1>Chroma-key avatar (transparent-background compositing)</h1>
  <p>
    The avatar's own video is keyed live and composited over this page's own background
    (the green checker below stands in for YOUR page content) — no green box, no fixed
    rectangle.
  </p>
  <p id="cc" role="status"></p>
  <div id="composited" role="img" aria-label="Live avatar video"></div>

  <!-- The session's OWN video element. Never shown directly — chroma-key-video reads frames
       from it and paints the composited (transparent-background) result into #composited
       instead. Off-screen, not display:none, so the browser still decodes it. aria-hidden
       because it's a pure relay with no informational value of its own — the accessible
       description of the avatar lives on #composited, the element AT users actually reach. -->
  <video id="source" autoplay playsinline muted aria-hidden="true"></video>

  <!-- socket.io is YOUR dependency — injected, never bundled by the SDK. -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" integrity="sha384-2huaZvOR9iDzHqslqwpR87isEmrfxqyWOF7hr7BY6KG0+hVKLoEXMPUJw3ynWuhO" crossorigin="anonymous"></script>
  <script type="module">
    // chroma-key-video is YOUR dependency too — the SDK never bundles or imports it. Any
    // class shaped `new ChromaKeyVideo(videoEl, options)` with a `.mount(container)` and a
    // `.destroy()` works; this example pulls the real one. There is no npm package for it —
    // load it by bundling https://github.com/kaltura/chroma-key-video locally, or straight
    // from jsDelivr's GitHub-CDN mode, pinned to a released tag:
    import { KalturaAvatarSession } from '../src/experience/index.js';
    import { attachChromaKeyAvatar } from '../src/experience/chroma-key.js';
    import { ChromaKeyVideo } from 'https://cdn.jsdelivr.net/gh/kaltura/chroma-key-video@v1.2.0/src/chromakey.js';

    const cc = document.getElementById('cc');

    // 1) Runtime endpoints + conversation token come from YOUR server (appInit).
    const init = await fetch('/appInit').then((r) => r.json());

    // 2) The session renders into its OWN <video> element, same as every other example —
    //    chroma-key-avatar changes nothing about how the session itself works.
    const video = document.getElementById('source');
    const session = new KalturaAvatarSession({
      token: init.ks, conversationManagerUrl: init.conversationManagerUrl,
      srsBaseUrl: init.srsBaseUrl, turnServerUrl: init.turnServerUrl,
      videoEl: video, socketFactory: (url, opts) => io(url, opts),
    });
    session.on('disclosure', ({ disclosureText }) => { cc.textContent = '⚠️ ' + disclosureText; });
    session.on('reconnecting', () => { cc.textContent = '… reconnecting'; });
    session.on('reconnected', () => { cc.textContent = ''; });

    // 3) attachChromaKeyAvatar() must be passed session.videoEl (the SAME element the
    //    session itself renders into) — construction is synchronous, no Promise. The
    //    returned `player` is the raw chroma-key-video instance, unwrapped: listen on IT
    //    directly for its own events, and destroy() fires automatically when this session
    //    ends or hits a fatal error — no extra teardown call needed on disconnect.
    // autoTune: 'adaptive' keeps re-deriving key params (min-key/bias/softness/spill) as
    // frames stream in, instead of locking to whatever the first frame's lighting looked like
    // (autoTune: true tunes once and stops). chroma-key-video keys by dominant-channel ratio,
    // not distance to a fixed target color, so adaptive tuning against the real decoded
    // footage is the library's own "best fit" path, not an approximation of one.
    let player;
    try {
      player = attachChromaKeyAvatar({
        session,
        videoEl: session.videoEl,
        ChromaKeyVideo,
        options: { channel: 'green', autoTune: 'adaptive' },
        container: document.getElementById('composited'),
      });
    } catch (err) {
      // Surface the failure on the page (the #cc status region) instead of leaving a
      // silent blank box — attachChromaKeyAvatar() throws a KalturaError with the cause
      // (e.g. WebGL unavailable) in `detail`.
      cc.textContent = '⚠️ Chroma-key compositor failed to start: ' + (err?.detail || err?.message || err);
      throw err;
    }

    // Kaltura's avatar renderer insets the animated subject within a margin of the native
    // frame (confirmed asymmetric — larger on some edges than others, independent of the
    // uploaded visual's own aspect ratio). chroma-key-video only removes GREEN pixels, so
    // that margin stays fully opaque black no matter how keying is tuned — every integrator
    // hits this, not just green-screen footage with a stray border. There's no server-side
    // option to remove it, so this detects the real, non-black content region straight from
    // the decoded video (not hardcoded per-avatar) and zooms/re-centers the canvas via CSS
    // transform once the compositor is live, so the visible box shows only the subject
    // (#composited's own overflow:hidden clips the rest).
    function detectContentBBox(sourceVideo) {
      const w = sourceVideo.videoWidth, h = sourceVideo.videoHeight;
      if (!w || !h) return null;
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const sctx = c.getContext('2d', { willReadFrequently: true });
      sctx.drawImage(sourceVideo, 0, 0, w, h);
      const data = sctx.getImageData(0, 0, w, h).data;
      let minX = w, maxX = -1, minY = h, maxY = -1;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const i = (y * w + x) * 4;
          if (data[i] >= 15 || data[i + 1] >= 15 || data[i + 2] >= 15) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      return maxX < 0 || maxY < 0 ? null : { w, h, minX, maxX, minY, maxY };
    }

    // A talking head moves (mouth, slight head turn), so one frame's bbox isn't a safe crop —
    // it would clip a later frame that reaches slightly further. Union the bbox across ~2.5s
    // of real frames before locking the crop.
    let cropUnion = null;
    function sampleIntoUnion(sourceVideo) {
      const bbox = detectContentBBox(sourceVideo);
      if (!bbox) return;
      const { w, h, minX, maxX, minY, maxY } = bbox;
      const contentW = maxX - minX, contentH = maxY - minY;
      if (contentW < w * 0.2 || contentH < h * 0.2 || (contentW > w * 0.97 && contentH > h * 0.97)) return;
      if (!cropUnion) { cropUnion = { w, h, minX, maxX, minY, maxY }; return; }
      cropUnion.minX = Math.min(cropUnion.minX, minX);
      cropUnion.maxX = Math.max(cropUnion.maxX, maxX);
      cropUnion.minY = Math.min(cropUnion.minY, minY);
      cropUnion.maxY = Math.max(cropUnion.maxY, maxY);
    }
    function applyCropFromUnion(canvasEl) {
      if (!cropUnion) return false;
      const { w, h, minX, maxX, minY, maxY } = cropUnion;
      const contentW = maxX - minX, contentH = maxY - minY;
      const SAFETY_ZOOM = 1.06; // absorbs edge-interpolation bleed and motion past the sampled window
      const scale = Math.min(Math.max(w / contentW, h / contentH) * SAFETY_ZOOM, 1.8);
      const cx = (minX + maxX) / 2 / w, cy = (minY + maxY) / 2 / h;
      const tx = (0.5 - cx * scale) * 100, ty = (0.5 - cy * scale) * 100;
      canvasEl.style.transform = `translate(${tx}%, ${ty}%) scale(${scale})`;
      return true;
    }

    player.addEventListener?.('started', () => {
      cc.textContent = '';
      const sampleTimer = setInterval(() => sampleIntoUnion(video), 150);
      setTimeout(() => {
        clearInterval(sampleTimer);
        const canvasEl = document.querySelector('#composited canvas');
        if (canvasEl) applyCropFromUnion(canvasEl);
      }, 2500);
    });

    await session.connect();
    window.addEventListener('beforeunload', () => session.disconnect());
  </script>
</body>
</html>
