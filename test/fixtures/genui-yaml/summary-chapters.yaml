summary: "The rule of thirds splits a layout into a calm base, a supporting color and a small accent. It keeps pages balanced and easy to scan."
chapters:
- "0:00-1:30 | Introduction: How thirds help a layout stay balanced and calm"
- "1:30-4:00 | The Split: Explanation of the three shares, base, support and accent, with visual examples"
- "4:00-6:00 | Before and After: A crowded layout is rebuilt with the rule into a clean page"
- "6:00-8:30 | Real Examples: Several finished pages that apply the rule well"
- "8:30-9:00 | Variations: How the rule bends for dark pages and dense dashboards"
