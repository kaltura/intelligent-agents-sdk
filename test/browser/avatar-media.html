<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>avatar-media real-browser harness</title>
<style>
  body { font: 12px/1.4 ui-monospace, monospace; margin: 12px; }
  #stage video, #stage audio { width: 160px; height: 120px; background: #000; margin: 2px; vertical-align: top; }
  #log { white-space: pre-wrap; }
</style>
</head>
<body>
<p>
  Real-browser harness for <code>src/experience/avatar-media.js</code> through the public session API.
  Both WebRTC legs are loopback peers inside this page; no network, no credentials, near-silent audio.
  Driven by <code>scripts/verify-avatar-media.mjs</code>.
</p>
<button id="go">start</button>
<button id="resume">resume playback</button>
<div id="stage"></div>
<pre id="log"></pre>
<script type="module">
import { KalturaAvatarSession, KalturaScriptedVideoSession } from '/src/experience/index.js';
import { attachChromaKeyAvatar } from '/src/experience/chroma-key.js';
import { FakeSocket, scriptHappyPath } from '/test/fakes/socket.js';

// ───────────────────────── constants / feature detection ─────────────────────────
const CONV_KS = 'djJ8' + btoa('v2|123|geniegpcid:1222').replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const WHEP_BASE = 'https://srs.example/rtc/v1/whep/';
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const has = {
  setSinkId: 'setSinkId' in HTMLMediaElement.prototype,
  mediaRecorder: typeof MediaRecorder === 'function',
  canvasCapture: typeof HTMLCanvasElement.prototype.captureStream === 'function',
};
const logEl = document.getElementById('log');
const log = (...a) => { logEl.textContent += a.map((x) => (typeof x === 'string' ? x : JSON.stringify(x))).join(' ') + '\n'; };

// ───────────────────────── harness state (reset per scenario) ─────────────────────────
const H = {
  pcs: [],            // every RTCPeerConnection the SDK built through LoopbackRTC
  peers: [],          // { pc, media } loopback answerers built by the WHEP/ASR stubs
  fetches: [],        // { url, method } every call the SDK made to the injected fetch
  sendKinds: ['video', 'audio'],
  delay: null,        // { kind, ms } → that kind starts sending late (replaceTrack(null) → replaceTrack(track))
  blockPlay: false,   // autoplay cells: instrumented play() rejects NotAllowedError while true
  gestureSession: null,
  gestureResolve: null,
  unhandled: 0,
  audioCtx: null,
};
window.addEventListener('unhandledrejection', () => { H.unhandled += 1; });
function audioCtx() { return (H.audioCtx ||= new AudioContext()); }

// ───────────────────────── loopback RTCPeerConnection ─────────────────────────
// The SDK builds its STV peer relay-only (iceConfig 'stv'); a loopback has no TURN, so the
// harness overrides the policy. Candidates are forwarded to the paired answerer through an
// addEventListener (the SDK owns pc.onicecandidate for its ICE watchdog).
function LoopbackRTC(cfg = {}) {
  const pc = new RTCPeerConnection({ ...cfg, iceServers: [], iceTransportPolicy: 'all' });
  pc.__peer = null; pc.__pending = [];
  pc.addEventListener('icecandidate', (e) => {
    if (!e.candidate) return;
    if (pc.__peer) pc.__peer.addIceCandidate(e.candidate).catch(() => {}); else pc.__pending.push(e.candidate);
  });
  H.pcs.push(pc);
  return pc;
}
function pair(pc, peer) {
  pc.__peer = peer;
  for (const c of pc.__pending.splice(0)) peer.addIceCandidate(c).catch(() => {});
  peer.addEventListener('icecandidate', (e) => {
    if (e.candidate && pc.signalingState !== 'closed') pc.addIceCandidate(e.candidate).catch(() => {});
  });
}
const ufrag = (sdp) => /a=ice-ufrag:(\S+)/.exec(sdp || '')?.[1];
const findOfferer = (sdp) => H.pcs.find((p) => p.signalingState !== 'closed' && ufrag(p.localDescription?.sdp) === ufrag(sdp));
async function gathered(pc) {
  if (pc.iceGatheringState === 'complete') return;
  await new Promise((r) => {
    pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') r(); });
    setTimeout(r, 2500);
  });
}

// ───────────────────────── sender media: hue-cycling canvas + near-silent tone ─────────────────────────
function senderMedia() {
  const canvas = document.createElement('canvas'); canvas.width = 160; canvas.height = 120;
  const g = canvas.getContext('2d'); let hue = 0;
  const paint = () => {
    hue = (hue + 23) % 360;
    g.fillStyle = `hsl(${hue} 90% 50%)`; g.fillRect(0, 0, 160, 120);
    g.fillStyle = '#fff'; g.fillRect(20, 20, 60, 60);
  };
  paint();
  const timer = setInterval(paint, 66);
  const vs = canvas.captureStream(15);
  const ac = audioCtx();
  const osc = ac.createOscillator(); osc.frequency.value = 330;
  const gain = ac.createGain(); gain.gain.value = 0.005;   // measurable in stats/analyser, inaudible on a real sink
  const dest = ac.createMediaStreamDestination();
  osc.connect(gain).connect(dest); osc.start();
  return {
    videoTrack: vs.getVideoTracks()[0], audioTrack: dest.stream.getAudioTracks()[0],
    stop() { clearInterval(timer); try { osc.stop(); } catch { /* */ } vs.getTracks().forEach((t) => t.stop()); dest.stream.getTracks().forEach((t) => t.stop()); },
  };
}

// ───────────────────────── WHEP server stub (answers the SDK's offer with a live loopback peer) ─────────────────────────
const httpRes = (status, body = '', location = null) => ({
  ok: status < 300, status, text: async () => body,
  headers: { get: (h) => (String(h).toLowerCase() === 'location' ? location : null) },
});
async function whepFetch(url, init = {}) {
  const method = init.method || 'GET';
  H.fetches.push({ url: String(url), method });
  if (!String(url).includes('/rtc/v1/whep')) return httpRes(200);
  if (method === 'DELETE') return httpRes(200);
  const pc = findOfferer(init.body);
  if (!pc) throw new Error('harness: WHEP offer matches no LoopbackRTC peer');
  const media = senderMedia();
  const peer = new RTCPeerConnection();
  H.peers.push({ pc: peer, media });
  await peer.setRemoteDescription({ type: 'offer', sdp: init.body });
  const late = [];
  for (const kind of ['video', 'audio']) {
    if (!H.sendKinds.includes(kind)) continue;               // omitted kind → its transceiver stays inactive, no ontrack
    const track = kind === 'video' ? media.videoTrack : media.audioTrack;
    const sender = peer.addTrack(track, new MediaStream([track]));   // reuses the offered recvonly transceiver; distinct msid per track
    if (H.delay?.kind === kind) { await sender.replaceTrack(null); late.push({ sender, track, ms: H.delay.ms }); }
  }
  await peer.setLocalDescription(await peer.createAnswer());
  await gathered(peer);                                          // non-trickle answer: the SDK posts once and reads the body
  pair(pc, peer);
  for (const l of late) setTimeout(() => { l.sender.replaceTrack(l.track).catch(() => {}); }, l.ms);
  return httpRes(201, peer.localDescription.sdp, `${WHEP_BASE}resource/${H.peers.length}`);
}

// ───────────────────────── ASR answerer (the mic uplink also needs a real peer) ─────────────────────────
async function asrAnswer(offer) {
  const pc = findOfferer(offer?.sdp);
  const peer = new RTCPeerConnection();
  H.peers.push({ pc: peer, media: null });
  await peer.setRemoteDescription(offer);
  await peer.setLocalDescription(await peer.createAnswer());
  await gathered(peer);
  if (pc) pair(pc, peer);
  return { type: 'answer', sdp: peer.localDescription.sdp };
}
async function fakeMic() { return audioCtx().createMediaStreamDestination().stream; }

// ───────────────────────── instrumented media elements ─────────────────────────
function instrument(el) {
  const proto = HTMLMediaElement.prototype;
  const w = { srcObject: 0, play: 0, muted: 0, volume: 0, setSinkId: [] };
  el.__w = w;
  for (const prop of ['srcObject', 'muted', 'volume']) {
    const d = Object.getOwnPropertyDescriptor(proto, prop);
    Object.defineProperty(el, prop, { configurable: true, get() { return d.get.call(el); }, set(v) { w[prop] += 1; d.set.call(el, v); } });
  }
  el.play = function play() {
    w.play += 1;
    if (H.blockPlay) return Promise.reject(new DOMException('autoplay blocked by harness', 'NotAllowedError'));
    return proto.play.call(el);
  };
  if (has.setSinkId) el.setSinkId = function setSinkId(id) { w.setSinkId.push(id); return proto.setSinkId.call(el, id); };
  return el;
}
const stage = document.getElementById('stage');
function makeEl(tag = 'video') {
  const el = document.createElement(tag);
  el.playsInline = true;
  stage.appendChild(el);
  return instrument(el);
}
const kinds = (streamOrEl) => {
  const s = streamOrEl instanceof MediaStream ? streamOrEl : streamOrEl?.srcObject;
  return s ? s.getTracks().map((t) => t.kind).sort().join(',') : String(s);
};

// ───────────────────────── probes ─────────────────────────
/** Poll until the element shows a non-black frame (the sender paints saturated colour + a white square). */
async function paints(el, ms = 4000) {
  const c = document.createElement('canvas'); c.width = 16; c.height = 12;
  const g = c.getContext('2d', { willReadFrequently: true });
  const t0 = performance.now();
  let sum = 0;
  while (performance.now() - t0 < ms) {
    if (el.videoWidth > 0 && el.readyState >= 2) {
      try {
        g.drawImage(el, 0, 0, 16, 12);
        const d = g.getImageData(0, 0, 16, 12).data;
        sum = 0; for (let i = 0; i < d.length; i += 4) sum += d[i] + d[i + 1] + d[i + 2];
        if (sum > 0) return { ok: true, w: el.videoWidth, h: el.videoHeight, readyState: el.readyState, paused: el.paused, ms: Math.round(performance.now() - t0) };
      } catch { /* not drawable yet */ }
    }
    await sleep(50);
  }
  return { ok: false, w: el.videoWidth, h: el.videoHeight, readyState: el.readyState, paused: el.paused, sum };
}
async function inboundStats(pc, kind) {
  if (!pc) return null;
  const rep = await pc.getStats();
  let out = null;
  rep.forEach((s) => {
    if (s.type === 'inbound-rtp' && (s.kind || s.mediaType) === kind) {
      out = { packets: s.packetsReceived || 0, bytes: s.bytesReceived || 0, energy: s.totalAudioEnergy, frames: s.framesDecoded };
    }
  });
  return out;
}
/** Poll RTP stats on the SDK's own peer until `kind` has received packets. */
async function flowing(pc, kind, ms = 4000, min = 5) {
  const t0 = performance.now();
  let s = null;
  while (performance.now() - t0 < ms) {
    s = await inboundStats(pc, kind);
    if (s && s.packets >= min) return { ok: true, ...s, ms: Math.round(performance.now() - t0) };
    await sleep(100);
  }
  return { ok: false, ...(s || { packets: 0 }) };
}
/** currentTime keeps advancing on the element (the only element-level "audio is really playing" signal). */
async function advancing(el, ms = 800) {
  const t0 = el.currentTime;
  await sleep(ms);
  return { ok: el.currentTime > t0, from: t0, to: el.currentTime, paused: el.paused, readyState: el.readyState };
}
async function rms(stream, ms = 1200) {
  const ac = audioCtx();
  const src = ac.createMediaStreamSource(stream);
  const an = ac.createAnalyser(); an.fftSize = 2048;
  src.connect(an);
  const buf = new Float32Array(an.fftSize);
  const t0 = performance.now(); let best = 0;
  while (performance.now() - t0 < ms) {
    an.getFloatTimeDomainData(buf);
    let acc = 0; for (const x of buf) acc += x * x;
    best = Math.max(best, Math.sqrt(acc / buf.length));
    if (best > 1e-4) break;
    await sleep(100);
  }
  src.disconnect();
  return { ok: best > 1e-4, rms: best, source: src };
}

// ───────────────────────── sessions ─────────────────────────
const live = new Set();
function newSession(cfg = {}, script = {}) {
  const socket = new FakeSocket();
  const session = new KalturaAvatarSession({
    token: CONV_KS, srsBaseUrl: 'https://srs.example', turnServerUrl: 'turn.example',
    socketFactory: () => socket, rtcConstructor: LoopbackRTC, fetch: whepFetch, getUserMedia: fakeMic,
    ...cfg,
  });
  scriptHappyPath(socket, { asrAnswer, ...script });
  live.add(session);
  return { session, socket, rescript: () => scriptHappyPath(socket, { asrAnswer, ...script }) };
}
function record(session) {
  const ev = {
    list: [], t: {},
    count: (n) => ev.list.filter((e) => e.name === n).length,
    of: (n) => ev.list.filter((e) => e.name === n).map((e) => e.p),
    idx: (n) => ev.list.findIndex((e) => e.name === n),
  };
  for (const n of ['track', 'videoMetadata', 'mediaReady', 'mediaRecovering', 'mediaRecovered', 'warning', 'ended', 'error', 'stateChange']) {
    session.on(n, (p) => { ev.list.push({ name: n, p, at: performance.now() }); ev.t[n] ??= performance.now(); });
  }
  return ev;
}
async function connected(cfg = {}, script = {}) {
  const s = newSession(cfg, script);
  const ev = record(s.session);
  const t0 = performance.now();
  await s.session.connect();
  return { ...s, ev, connectMs: Math.round(performance.now() - t0) };
}
const stv = (session) => session._pcStv;
const ended = (tracks) => tracks.every((t) => t.readyState === 'ended');
const liveTracks = (tracks) => tracks.length > 0 && tracks.every((t) => t.readyState === 'live');

// ───────────────────────── scenario context ─────────────────────────
function ctx(name) {
  const checks = [], skipped = [];
  return {
    name, checks, skipped,
    check(label, ok, detail) { checks.push({ name: label, ok: !!ok, detail: detail === undefined ? undefined : (typeof detail === 'string' ? detail : JSON.stringify(detail)) }); return !!ok; },
    skip(label, reason) { skipped.push({ name: label, reason }); },
  };
}

// ───────────────────────── scenarios (plan §5.7) ─────────────────────────
const S = {};

S['shapes-simple'] = async (c) => {
  const v = makeEl();
  const { session, ev } = await connected({ videoEl: v });
  c.check('state connected', session.state === 'connected', session.state);
  c.check('videoEl carries audio+video', kinds(v) === 'audio,video', kinds(v));
  c.check('audioEl null', session.audioEl === null);
  c.check('avatarStream carries both', kinds(session.avatarStream) === 'audio,video');
  c.check('avatarStream is not the element stream', session.avatarStream !== v.srcObject);
  c.check('srcObject written once', v.__w.srcObject === 1, v.__w);
  c.check('play() once', v.__w.play === 1, v.__w);
  c.check('no muted/volume writes', v.__w.muted === 0 && v.__w.volume === 0, v.__w);
  c.check('video paints', ...pair2(await paints(v)));
  c.check('audio RTP flows', ...pair2(await flowing(stv(session), 'audio')));
  c.check('element playing', !v.paused && v.readyState >= 3, { paused: v.paused, readyState: v.readyState });
  c.check('mediaReady once', ev.count('mediaReady') === 1, ev.of('mediaReady'));
  c.check('no warnings', ev.count('warning') === 0, ev.of('warning'));
};

S['shapes-split'] = async (c) => {
  const v = makeEl(), a = makeEl('audio');
  const { session, ev } = await connected({ videoEl: v, audioEl: a });
  c.check('videoEl video only', kinds(v) === 'video', kinds(v));
  c.check('audioEl audio only', kinds(a) === 'audio', kinds(a));
  c.check('avatarStream carries both', kinds(session.avatarStream) === 'audio,video');
  c.check('one srcObject write per element', v.__w.srcObject === 1 && a.__w.srcObject === 1, { v: v.__w, a: a.__w });
  c.check('one play() per element', v.__w.play === 1 && a.__w.play === 1, { v: v.__w.play, a: a.__w.play });
  c.check('video paints', ...pair2(await paints(v)));
  c.check('audio RTP flows', ...pair2(await flowing(stv(session), 'audio')));
  c.check('audio element playing', ...pair2(await advancing(a)));
  c.check('mediaReady once', ev.count('mediaReady') === 1, ev.count('mediaReady'));
  c.check('no warnings', ev.count('warning') === 0, ev.of('warning'));
};

S['shapes-headless'] = async (c) => {
  const { session, ev } = await connected({ videoEl: null });
  c.check('no element bound', session.videoEl === null && session.audioEl === null);
  c.check('avatarStream carries both', kinds(session.avatarStream) === 'audio,video', kinds(session.avatarStream));
  c.check('mediaReady once (no element gate)', ev.count('mediaReady') === 1, ev.of('mediaReady'));
  c.check('video RTP flows', ...pair2(await flowing(stv(session), 'video')));
  c.check('audio RTP flows', ...pair2(await flowing(stv(session), 'audio')));
  c.check('startPlayback() → false (nothing bound)', (await session.startPlayback()) === false);
  const v = makeEl();
  session.setVideoEl(v);
  c.check('late setVideoEl binds both', kinds(v) === 'audio,video', kinds(v));
  c.check('late element paints', ...pair2(await paints(v)));
  c.check('srcObject once, play once', v.__w.srcObject === 1 && v.__w.play === 1, v.__w);
  c.check('no extra mediaReady on late bind', ev.count('mediaReady') === 1);
};

S['shapes-audio-only-el'] = async (c) => {
  const a = makeEl('audio');
  const { session, ev, connectMs } = await connected({ videoEl: a });
  c.check('connect settles well under the 6s hard cap', connectMs < 5000, connectMs);
  c.check('<audio> as videoEl carries both tracks', kinds(a) === 'audio,video', kinds(a));
  c.check('audio RTP flows', ...pair2(await flowing(stv(session), 'audio')));
  c.check('audio element playing', ...pair2(await advancing(a)));
  c.check('mediaReady once', ev.count('mediaReady') === 1, ev.of('mediaReady'));
  c.check('no warnings', ev.count('warning') === 0, ev.of('warning'));
};

S['video-only'] = async (c) => {
  H.sendKinds = ['video'];
  const v = makeEl(), a = makeEl('audio');
  const { session, ev, connectMs } = await connected({ videoEl: v, audioEl: a });
  c.check('connect settles', connectMs < 5000, connectMs);
  c.check('videoEl video only', kinds(v) === 'video', kinds(v));
  c.check('audioEl bound but empty', a.srcObject instanceof MediaStream && kinds(a) === '', kinds(a));
  c.check('avatarStream video only', kinds(session.avatarStream) === 'video', kinds(session.avatarStream));
  c.check('video paints', ...pair2(await paints(v)));
  c.check('mediaReady once', ev.count('mediaReady') === 1, ev.of('mediaReady'));
  c.check('no warnings', ev.count('warning') === 0, ev.of('warning'));
};

S['audio-only'] = async (c) => {
  H.sendKinds = ['audio'];
  const v = makeEl();
  const { session, ev, connectMs } = await connected({ videoEl: v });
  c.check('connect settles (R6: canplay fires for an audio-only stream)', connectMs < 5000, connectMs);
  c.check('videoEl audio only', kinds(v) === 'audio', kinds(v));
  c.check('audio RTP flows', ...pair2(await flowing(stv(session), 'audio')));
  c.check('element playing', ...pair2(await advancing(v)));
  c.check('mediaReady once', ev.count('mediaReady') === 1, ev.of('mediaReady'));
  c.check('no warnings', ev.count('warning') === 0, ev.of('warning'));
};

S['late-audio'] = async (c) => {
  H.delay = { kind: 'audio', ms: 1500 };
  const v = makeEl();
  const { session, ev } = await connected({ videoEl: v });
  const readyAt = ev.t.mediaReady;
  c.check('both tracks attached at negotiation', kinds(v) === 'audio,video', kinds(v));
  c.check('video paints before audio flows', ...pair2(await paints(v)));
  const early = await inboundStats(stv(session), 'audio');
  const a = await flowing(stv(session), 'audio', 5000);
  c.check('audio starts flowing later', a.ok, { early, late: a });
  c.check('mediaReady fired before audio arrived', readyAt < performance.now() - a.ms, { readyAt, audioAfterMs: a.ms });
  c.check('mediaReady once', ev.count('mediaReady') === 1, ev.count('mediaReady'));
  c.check('element still playing', !v.paused, v.paused);
};

S['late-video'] = async (c) => {
  H.delay = { kind: 'video', ms: 1500 };
  const v = makeEl();
  const { session, ev, connectMs } = await connected({ videoEl: v });
  c.check('connect settles without frames (2s canplay fallback, under the hard cap)', connectMs < 5500, connectMs);
  c.check('both tracks attached', kinds(v) === 'audio,video', kinds(v));
  c.check('audio flows meanwhile', ...pair2(await flowing(stv(session), 'audio')));
  c.check('video paints once frames arrive', ...pair2(await paints(v, 5000)));
  c.check('mediaReady once', ev.count('mediaReady') === 1, ev.of('mediaReady'));
  c.check('no warnings', ev.count('warning') === 0, ev.of('warning'));
};

S['readiness-order'] = async (c) => {
  const v = makeEl();
  const { ev } = await connected({ videoEl: v });
  const names = ev.list.map((e) => e.name).filter((n) => ['track', 'videoMetadata', 'mediaReady'].includes(n));
  c.check('two track events first', names.slice(0, 2).join(',') === 'track,track', names);
  c.check('videoMetadata once', ev.count('videoMetadata') === 1, ev.of('videoMetadata'));
  c.check('videoMetadata 160x120', ev.of('videoMetadata')[0]?.videoWidth === 160 && ev.of('videoMetadata')[0]?.videoHeight === 120, ev.of('videoMetadata'));
  c.check('mediaReady once', ev.count('mediaReady') === 1, ev.of('mediaReady'));
  c.check('mediaReady after both tracks', ev.idx('mediaReady') > ev.list.map((e) => e.name).lastIndexOf('track'), names);
  const mr = ev.of('mediaReady')[0];
  c.check('mediaReady carries mode video + real dimensions', mr?.mode === 'video' && mr.videoWidth === 160 && mr.videoHeight === 120, mr);
  const connectedIdx = ev.list.findIndex((e) => e.name === 'stateChange' && e.p?.state === 'connected');
  c.check("mediaReady before stateChange 'connected'", ev.idx('mediaReady') < connectedIdx, { mediaReady: ev.idx('mediaReady'), connected: connectedIdx });
  c.check('element playable at mediaReady', v.readyState >= 3, v.readyState);
  c.check('video paints', ...pair2(await paints(v)));
};

S['mutes'] = async (c) => {
  const v = makeEl();
  const { session } = await connected({ videoEl: v });
  c.check('unmuted by default', v.muted === false && session.audioOutputMuted === false);
  session.muteAudioOutput();
  c.check('muteAudioOutput → sink muted', v.muted === true && session.audioOutputMuted === true, v.__w);
  c.check('RTP keeps flowing while muted', ...pair2(await flowing(stv(session), 'audio')));
  session.muteAudioOutput();
  c.check('idempotent: one muted write', v.__w.muted === 1, v.__w);
  session.unmuteAudioOutput();
  c.check('unmute', v.muted === false && session.audioOutputMuted === false);
  session.muteAudioOutput();
  const a = makeEl('audio');
  session.setAudioEl(a);
  c.check('stored mute follows to the new sink', a.muted === true, { a: a.muted, v: v.muted });
  session.unmuteAudioOutput();
  c.check('unmute lands on the audio element', a.muted === false);
  c.check('video element never had volume writes', v.__w.volume === 0 && a.__w.volume === 0);
};

S['volume'] = async (c) => {
  const v = makeEl();
  const { session } = await connected({ videoEl: v });
  session.setAudioOutputVolume(0.3);
  c.check('volume 0.3 on sink', Math.abs(v.volume - 0.3) < 1e-6 && session.audioOutputVolume === 0.3, v.volume);
  session.setAudioOutputVolume(5);
  c.check('clamped to 1', v.volume === 1 && session.audioOutputVolume === 1, v.volume);
  session.setAudioOutputVolume(-1);
  c.check('clamped to 0', v.volume === 0 && session.audioOutputVolume === 0, v.volume);
  let threw = null; try { session.setAudioOutputVolume('0.5'); } catch (e) { threw = e.code; }
  c.check('non-number → bad_request', threw === 'bad_request', threw);
  session.setAudioOutputVolume(0.3);
  const a = makeEl('audio');
  session.setAudioEl(a);
  c.check('volume follows to the audio element', Math.abs(a.volume - 0.3) < 1e-6, a.volume);
  c.check('audio still flows at low volume', ...pair2(await advancing(a)));
  c.check('RTP flows', ...pair2(await flowing(stv(session), 'audio')));

S['devices'] = async (c) => {

S['mixing'] = async (c) => {
  const { session } = await connected({ videoEl: null });

// R-d: re-subscribe while the old tracks are live → same element stream, no rebind, no replay.
S['races-recover'] = async (c) => {
  {
    const v = makeEl();
    const { session, ev } = await connected({ videoEl: v });
    c.check('R-d: paints before recovery', ...pair2(await paints(v)));
    const stream0 = session.avatarStream, so0 = v.srcObject, old = stream0.getTracks(), pc0 = stv(session);
    const writes = v.__w.srcObject, plays = v.__w.play, readyBefore = ev.count('mediaReady');
    let emptied = 0, pauses = 0; v.addEventListener('emptied', () => { emptied += 1; }); v.addEventListener('pause', () => { pauses += 1; });
    const ct0 = v.currentTime;
    await session._recoverMedia('stv', pc0);
    c.check('R-d: mediaRecovered re-subscribe', ev.of('mediaRecovered').some((p) => p.channel === 'stv' && p.method === 're-subscribe'), ev.of('mediaRecovered'));
    c.check('R-d: new peer', stv(session) !== pc0 && pc0.signalingState === 'closed');
    c.check('R-d: avatarStream identity kept', session.avatarStream === stream0);
    c.check('R-d: element srcObject identity kept', v.srcObject === so0);
    // Firefox (with a 'pause' event) and WebKit (silently) report the element paused once all its tracks ended, before the
    // replacements arrive; the SDK resumes it with one play(). Chromium never pauses: zero play() calls.
    c.check('R-d: no srcObject write; at most one play() to resume, and the element is playing', v.__w.srcObject === writes && v.__w.play - plays <= 1 && v.paused === false, { ...v.__w, plays, pauses, paused: v.paused });
    c.check('R-d: old tracks ended', ended(old));
    c.check('R-d: new tracks live', liveTracks(session.avatarStream.getTracks()) && !session.avatarStream.getTracks().some((t) => old.includes(t)));
    c.check('R-d: paints after recovery', ...pair2(await paints(v)));
    c.check('R-d: audio flows on the new peer', ...pair2(await flowing(stv(session), 'audio')));
    // Chromium resets currentTime when the tracks inside the same srcObject are swapped; what matters is no 'emptied' and playback advancing again.
    c.check('R-d: no emptied event', emptied === 0, { emptied, ct0, now: v.currentTime });
    c.check('R-d: playback advancing after recovery', ...pair2(await advancing(v)));
    c.check('R-d: mediaReady once more (once per STV subscribe)', ev.count('mediaReady') === readyBefore + 1, ev.count('mediaReady'));
    c.check('R-d: no warnings', ev.count('warning') === 0, ev.of('warning'));
    session.disconnect();
  }
};

async function autoplay(c, split) {
  H.blockPlay = true;
  const v = makeEl(), a = split ? makeEl('audio') : null;

  await sleep(50);

  c.check('playback_blocked warning per element', warns === (split ? 'audio,video' : 'video'), ev.of('warning'));
  c.check('warning names startPlayback()', ev.of('warning').every((w) => /startPlayback\(\)/.test(w.message)));
  c.check('connect still resolved, mediaReady once', session.state === 'connected' && ev.count('mediaReady') === 1, ev.count('mediaReady'));
  c.check('elements paused', v.paused && (!a || a.paused));
  H.gestureSession = session;
  const gesture = new Promise((r) => { H.gestureResolve = r; });
  window.__gestureWanted = true;
  const r = await Promise.race([gesture, sleep(15000).then(() => 'no-gesture')]);
  c.check('startPlayback() from the click → true', r === true, r);
  c.check('one retry per blocked element', v.__w.play === 2 && (!a || a.__w.play === 2), { v: v.__w.play, a: a?.__w.play });
  c.check('video paints after gesture', ...pair2(await paints(v)));
  if (a) c.check('audio element playing after gesture', ...pair2(await advancing(a)));
  else c.check('element playing after gesture', !v.paused, v.paused);
  c.check('audio RTP flowed all along', ...pair2(await flowing(stv(session), 'audio')));
}
S['autoplay-simple'] = (c) => autoplay(c, false);
S['autoplay-split'] = (c) => autoplay(c, true);

// ───────────────────────── runner API ─────────────────────────
async function cleanup() {
  for (const s of live) { try { s.disconnect(); } catch { /* */ } }
  live.clear();
  for (const p of H.peers) { try { p.pc.close(); } catch { /* */ } p.media?.stop(); }
  for (const p of H.pcs) { try { p.close(); } catch { /* */ } }
  H.pcs = []; H.peers = []; H.fetches = [];
  H.sendKinds = ['video', 'audio']; H.delay = null; H.blockPlay = false; H.gestureSession = null; H.gestureResolve = null;
  stage.replaceChildren();
}

window.__scenarios = Object.keys(S);
window.__run = async (name) => {
  const c = ctx(name);
  const t0 = performance.now();
  const unhandled0 = H.unhandled;
  try {
    if (!S[name]) throw new Error(`unknown scenario ${name}`);
    await S[name](c);
    c.check('no unhandled rejections', H.unhandled === unhandled0, H.unhandled - unhandled0);
  } catch (e) {
    c.check('scenario threw', false, `${e?.name || 'Error'}: ${e?.message || e}\n${e?.stack || ''}`);
  } finally {
    await cleanup();
  }
  const result = { name, pass: c.checks.every((k) => k.ok), checks: c.checks, skipped: c.skipped, ms: Math.round(performance.now() - t0) };
  log(`${result.pass ? 'OK  ' : 'FAIL'} ${name} (${result.ms}ms)`);
  for (const k of c.checks.filter((k) => !k.ok)) log(`     ✖ ${k.name}: ${k.detail ?? ''}`);
  for (const k of c.skipped) log(`     ~ skipped ${k.name}: ${k.reason}`);
  window.__result = result;
  return result;
};

  let r; try { r = await H.gestureSession?.startPlayback(); } catch (e) { r = `threw ${e?.message}`; }

});
