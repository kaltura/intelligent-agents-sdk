rules:
  - id: no-eval-or-dynamic-function
    languages: [javascript]
    severity: ERROR
    message: >-
      Dynamic code execution (eval/new Function) — matches SDK_CONSTITUTION.md
      Rule S-1. Untrusted input reaching this is an injection vector.
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: new Function(...)

  - id: no-html-sink-assignment
    languages: [javascript]
    severity: ERROR
    message: >-
      Assignment to innerHTML/outerHTML/insertAdjacentHTML — matches
      SDK_CONSTITUTION.md Rule S-2. Untrusted content reaching a DOM HTML
      sink is an XSS vector.
    patterns:
      - pattern-either:
          - pattern: $EL.innerHTML = ...
          - pattern: $EL.outerHTML = ...
          - pattern: $EL.insertAdjacentHTML(...)

  - id: no-hardcoded-credential-literal
    languages: [javascript]
    severity: ERROR
    message: >-
      Hardcoded credential-shaped literal assigned to a secret/token/key
      field — matches SDK_CONSTITUTION.md Rule S-6. Secrets must come from
      env/caller input only, never a literal in source.
    patterns:
      - pattern-either:
          - pattern: $X.adminSecret = "..."
          - pattern: $X.apiKey = "..."
          - pattern: $X.password = "..."
      - metavariable-regex:
          metavariable: $X
          regex: .+

  - id: no-dynamic-shell-command
    languages: [javascript]
    severity: ERROR
    message: >-
      child_process exec/execSync called with a dynamically-built command
      (template literal or string concatenation), or spawn/spawnSync called
      with shell:true — untrusted input reaching this is a shell-injection
      vector. Use a static command string with an argv array instead.
    patterns:
      - pattern-either:
          - pattern: exec(`...${$X}...`, ...)
          - pattern: exec($A + $B, ...)
          - pattern: execSync(`...${$X}...`, ...)
          - pattern: execSync($A + $B, ...)
          - pattern: 'spawn($CMD, ..., {..., shell: true, ...})'
          - pattern: 'spawnSync($CMD, ..., {..., shell: true, ...})'

  - id: no-raw-fetch-bypass
    languages: [javascript]
    severity: ERROR
    message: >-
      Raw global fetch() call outside the injectable Http transport
      (core/http.js). This bypasses the shared retry/backoff and
      response-size budgeting in http.js — and if the target URL comes
      from caller input, it also skips the isPrivateOrLoopbackHost
      SSRF check that wire.js/session.js apply before their fetch calls.
    paths:
      exclude:
        - '**/src/core/http.js'
    pattern: fetch(...)
