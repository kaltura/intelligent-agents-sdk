name: Release

# Runs only when a git tag matching v*.*.* is pushed (e.g. v1.0.0). Creates a
# GitHub Release with notes GitHub auto-generates from the merged PRs since the
# previous tag (--generate-notes) — no hand-maintained CHANGELOG.md to drift
# out of sync with what actually shipped. Does NOT publish to npm (npm publish
# stays disabled by design; jsDelivr serves this repo's raw files straight from
# the tag — see README.md's Quick start).
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  actions: write

jobs:
  release:
    name: 📦 Draft GitHub Release from merged PRs
    runs-on: ubuntu-26.04
    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: 📚 Every SDK doc has an entry in the docs site manifest (gh-pages-src)
        # Runs before the Release is created, so a doc missing from the site
        # fails here and not in the generate-docs run that the last step fires.
        # Fix: add the entry on gh-pages-src, then re-run this job.
        run: |
          git fetch --depth=1 origin gh-pages-src
          git worktree add --detach ../site FETCH_HEAD
          node --input-type=module -e "
            const m = await import(process.env.GITHUB_WORKSPACE + '/../site/scripts/generate-docs.mjs');
            m.checkSourceCoverage(process.cwd());
            console.log('site manifest covers every SDK doc');
          "

      - name: 🌐 Smoke-test jsDelivr GitHub-CDN URLs for this tag
        run: |
          TAG="${{ github.ref_name }}"
          # Derive the entry-point list from package.json's exports map so a new
          # export can never ship without CDN coverage (issue #85 — chroma-key was
          # missing from a hand-maintained copy of this list). Wildcard subpaths
          # (./test/fakes/*) resolve to no single file and are skipped.
          ENTRY_POINTS=()
          while IFS= read -r path; do
            ENTRY_POINTS+=("$path")
          done < <(node -e '
            const { exports: map } = require("./package.json");
            for (const target of Object.values(map)) {
              if (!target.includes("*")) console.log(target.replace(/^\.\//, ""));
            }
          ')
          if [ "${#ENTRY_POINTS[@]}" -eq 0 ]; then
            echo "✗ derived zero entry points from package.json exports"
            exit 1
          fi
          echo "entry points under test: ${ENTRY_POINTS[*]}"
          for path in "${ENTRY_POINTS[@]}"; do
            url="https://cdn.jsdelivr.net/gh/kaltura/intelligent-agents-sdk@${TAG}/${path}"
            echo "checking $url"
            ok=""
            for attempt in 1 2 3 4 5; do
              status=$(curl -s -o /dev/null -w '%{http_code}' "$url")
              if [ "$status" = "200" ]; then
                ok=1
                echo "  ✓ 200 OK (attempt $attempt)"
                break
              fi
              echo "  attempt $attempt: HTTP $status — retrying in 10s"
              sleep 10
            done
            if [ -z "$ok" ]; then
              echo "✗ jsDelivr never returned 200 for $url after 5 attempts"
              exit 1
            fi
          done

      - name: 📦 Smoke-test the npm install route that the app-builder skill uses
        run: |
          TAG="${{ github.ref_name }}"
          dir="$(mktemp -d)"
          cd "$dir"
          npm init -y >/dev/null
          npm install "github:kaltura/intelligent-agents-sdk#${TAG}"
          node --input-type=module -e "
            const map = JSON.parse(await (await import('node:fs/promises')).readFile('node_modules/@kaltura/intelligent-agents/package.json', 'utf8')).exports;
            for (const key of Object.keys(map)) {
              if (key.includes('*')) continue;
              const spec = key === '.' ? '@kaltura/intelligent-agents' : '@kaltura/intelligent-agents/' + key.slice(2);
              await import(spec);
              console.log('  ✓ import ' + spec);
            }
          "

      - name: 📦 Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes

      - name: 📚 Fire the docs site's generate-docs workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run generate-docs.yml --repo kaltura/intelligent-agents-sdk --ref gh-pages-src

  distribution:
    name: 🌐 Verify the CDN distribution (jsDelivr @tag, @latest, real browser)
    needs: release
    runs-on: ubuntu-26.04
    # The script polls jsDelivr's resolver for @latest with its own deadline
    # (DIST_WAIT_SECONDS); this only caps a hung browser or install.
    timeout-minutes: 30
    steps:
      - name: 📥 Check out the repo with full history (the script reads files from the tag with git show)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install Chromium
        run: npx playwright install --with-deps chromium

      - name: 🧹 Purge jsDelivr's cached @latest, @major and @major.minor for every src/ file
        # jsDelivr caches range refs per file, so after a new tag they serve the previous release until purged.
        # Best effort: the verify step below is the check.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          V="${TAG#v}"
          MAJOR="${V%%.*}"
          MINOR="${V%.*}"
          for ref in latest "$MAJOR" "$MINOR"; do
            { git ls-files src; echo package.json; } \
              | jq -R -s --arg ref "$ref" '{path: (split("\n") | map(select(length > 0)) | map("/gh/kaltura/intelligent-agents-sdk@" + $ref + "/" + .))}' \
              | curl -sS --fail-with-body -X POST https://purge.jsdelivr.net/ -H 'Content-Type: application/json' --data-binary @- \
              | jq -r '"@'"$ref"' purge: " + (.status // "unknown")' || echo "@$ref purge request failed, continuing"
          done

      - name: 🌐 Every src/ file byte-identical on @tag, @latest, @major, @major.minor; exports import in headless Chromium; previous tag still served
        id: verify_distribution
        env:
          DIST_WAIT_SECONDS: '900'
        run: |
          set -o pipefail
          npm run verify:distribution -- "${{ github.ref_name }}" 2>&1 | tee verify-distribution-output.log

      - name: 📝 Write job summary
        if: always()
        run: |
          {
            echo "### 🌐 CDN distribution check for ${{ github.ref_name }} — ${{ steps.verify_distribution.outcome }}"
            echo
            echo '```'
            grep -E '^(==|RESULT|  ✗)' verify-distribution-output.log || tail -n 40 verify-distribution-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: ⚠️ Flag the failure on the GitHub Release itself
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh release view "$TAG" --json body --jq .body > release-body.md
          # One warning per release, even across re-runs of this job.
          if grep -q '<!-- distribution-check-failed -->' release-body.md; then
            echo "release notes already carry the warning; not appending again"
            exit 0
          fi
          {
            echo
            echo "<!-- distribution-check-failed -->"
            echo "> ⚠️ **Distribution check failed.** The jsDelivr CDN did not match this tag when checked after publishing. See the [workflow run]($RUN_URL) before pinning to \`@$TAG\` or \`@latest\`."
          } >> release-body.md
          gh release edit "$TAG" --notes-file release-body.md
