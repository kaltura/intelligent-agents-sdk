name: Release

# Runs only when a git tag matching v*.*.* is pushed (e.g. v1.0.0). Creates a
# GitHub Release with notes GitHub auto-generates from the merged PRs since the
# previous tag (--generate-notes) — no hand-maintained CHANGELOG.md to drift
# out of sync with what actually shipped. Does NOT publish to npm (npm publish
# stays disabled by design; jsDelivr serves this repo's raw files straight from
# the tag — see README.md's Quick start).
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: 📦 Draft GitHub Release from merged PRs
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: 🌐 Smoke-test jsDelivr GitHub-CDN URLs for this tag
        run: |
          TAG="${{ github.ref_name }}"
          # Derive the entry-point list from package.json's exports map so a new
          # export can never ship without CDN coverage (issue #85 — chroma-key was
          # missing from a hand-maintained copy of this list). Wildcard subpaths
          # (./test/fakes/*) resolve to no single file and are skipped.
          ENTRY_POINTS=()
          while IFS= read -r path; do
            ENTRY_POINTS+=("$path")
          done < <(node -e '
            const { exports: map } = require("./package.json");
            for (const target of Object.values(map)) {
              if (!target.includes("*")) console.log(target.replace(/^\.\//, ""));
            }
          ')
          if [ "${#ENTRY_POINTS[@]}" -eq 0 ]; then
            echo "✗ derived zero entry points from package.json exports"
            exit 1
          fi
          echo "entry points under test: ${ENTRY_POINTS[*]}"
          for path in "${ENTRY_POINTS[@]}"; do
            url="https://cdn.jsdelivr.net/gh/kaltura/intelligent-agents-sdk@${TAG}/${path}"
            echo "checking $url"
            ok=""
            for attempt in 1 2 3 4 5; do
              status=$(curl -s -o /dev/null -w '%{http_code}' "$url")
              if [ "$status" = "200" ]; then
                ok=1
                echo "  ✓ 200 OK (attempt $attempt)"
                break
              fi
              echo "  attempt $attempt: HTTP $status — retrying in 10s"
              sleep 10
            done
            if [ -z "$ok" ]; then
              echo "✗ jsDelivr never returned 200 for $url after 5 attempts"
              exit 1
            fi
          done

      - name: 📦 Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
