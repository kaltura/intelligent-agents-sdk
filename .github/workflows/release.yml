name: Release

# Runs only when a git tag matching v*.*.* is pushed (e.g. v1.0.0). Creates a
# GitHub Release with notes pulled straight from CHANGELOG.md — it does NOT
# publish to npm (npm publish stays disabled by design; jsDelivr serves this
# repo's raw files straight from the tag — see README.md's Quick start).
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: 📦 Draft GitHub Release from CHANGELOG.md
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@v7

      - name: 📝 Extract this version's CHANGELOG.md section
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # Pull the block between "## [<version>]" and the next "## [" heading.
          # ver is escaped in BEGIN so "." in a semver tag can't match "any character".
          awk -v ver="$TAG" '
            BEGIN { gsub(/[.[\]\\^$*+?(){}|]/, "\\\\&", ver) }
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "⚠️ No CHANGELOG.md section found for version $TAG — add one before tagging." > release-notes.md
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 🌐 Smoke-test jsDelivr GitHub-CDN URLs for this tag
        run: |
          TAG="${{ github.ref_name }}"
          ENTRY_POINTS=(
            "src/index.js"
            "src/management/index.js"
            "src/experience/index.js"
            "src/experience/presenter.js"
            "src/experience/genui/index.js"
            "src/experience/noise-suppressor.js"
            "src/experience/analytics.js"
          )
          for path in "${ENTRY_POINTS[@]}"; do
            url="https://cdn.jsdelivr.net/gh/kaltura/intelligent-agents-sdk@${TAG}/${path}"
            echo "checking $url"
            ok=""
            for attempt in 1 2 3 4 5; do
              status=$(curl -s -o /dev/null -w '%{http_code}' "$url")
              if [ "$status" = "200" ]; then
                ok=1
                echo "  ✓ 200 OK (attempt $attempt)"
                break
              fi
              echo "  attempt $attempt: HTTP $status — retrying in 10s"
              sleep 10
            done
            if [ -z "$ok" ]; then
              echo "✗ jsDelivr never returned 200 for $url after 5 attempts"
              exit 1
            fi
          done

      - name: 📦 Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "v${{ steps.notes.outputs.tag }}" \
            --notes-file release-notes.md
