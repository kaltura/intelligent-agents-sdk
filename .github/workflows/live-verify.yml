          AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
        run: |
          set -o pipefail
          npm run live-verify:agents 2>&1 | tee live-verify-agents-output.log

      # Scratch Visual → avatars create/get/update(openingPhrase)/delete → cleanup, against the real Kaltura API
      - name: Resources · Avatars
        id: live_verify_avatars
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs['avatars'] == 'true') }}
        timeout-minutes: 15
        env:
          AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
        run: |
          set -o pipefail
          npm run live-verify:avatars 2>&1 | tee live-verify-avatars-output.log

      # Catalog createVisual/get/list/update(rename)/delete → cleanup, against the real Kaltura API
      - name: Resources · Catalog
        id: live_verify_catalog
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs['catalog'] == 'true') }}
        timeout-minutes: 15
        env:
          AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
        run: |
          set -o pipefail
          npm run live-verify:catalog 2>&1 | tee live-verify-catalog-output.log

      # Scratch intellect → capabilities/prompts/snapshot-restore → conversations send/status → cleanup, against the real Kaltura API
      - name: Resources · Intellects
        id: live_verify_intellects_conversations
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs['intellects-conversations'] == 'true') }}
        timeout-minutes: 15
        env:
          AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
        run: |
          set -o pipefail
          npm run live-verify:intellects-conversations 2>&1 | tee live-verify-intellects-conversations-output.log

      # Knowledge addRecord/getRecord/list/updateRecord/addSource/removeSource/entryStatus/deleteRecord → cleanup, against the real Kaltura API
      - name: Resources · Knowledge
        id: live_verify_knowledge
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs['knowledge'] == 'true') }}
        timeout-minutes: 15
        env:
          AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
        run: |
          set -o pipefail
          npm run live-verify:knowledge 2>&1 | tee live-verify-knowledge-output.log

      # Skills add/get/list/update(rename)/delete → cleanup, against the real Kaltura API
      - name: Resources · Skills
        id: live_verify_skills
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs['skills'] == 'true') }}
        timeout-minutes: 15
        env:
          AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
        run: |
          set -o pipefail
          npm run live-verify:skills 2>&1 | tee live-verify-skills-output.log

      # Scratch tool add/get/delete + code/csv unavailable-by-default 403 gate, against the real Kaltura API
      - name: Resources · Tools
        id: live_verify_tools
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs['tools'] == 'true') }}
        timeout-minutes: 15
        env:
          AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
        run: |
          set -o pipefail
          npm run live-verify:tools 2>&1 | tee live-verify-tools-output.log

      - name: Resources · MCP servers · install cloudflared
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs['mcp'] == 'true') }}
        timeout-minutes: 15
        run: |
          curl -sSfL -o cloudflared https://github.com/cloudflare/cloudflared/releases/download/2026.9.3/cloudflared-linux-amd64
          echo "77e26d8d900e0b8469f416239d14b5f296525fdf79fee6f511ef55609e3fbac2  cloudflared" | sha256sum -c -
          sudo install -m 0755 cloudflared /usr/local/bin/cloudflared

      - name: Resources · MCP servers · start the reference server
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs['mcp'] == 'true') }}
        timeout-minutes: 15
        run: |
          node examples/mcp-live-showcase/server.mjs > mcp-server.log 2>&1 &
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8877/mcp || true)
            [ -n "$code" ] && [ "$code" != "000" ] && break
            sleep 0.5
          done

      - name: Resources · MCP servers · open a cloudflared tunnel
        id: tunnel
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs['mcp'] == 'true') }}
        timeout-minutes: 15
        run: |
          cloudflared tunnel --url http://localhost:8877 > cloudflared.log 2>&1 &
          url=""
          for i in $(seq 1 30); do
            url=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' cloudflared.log | head -n1 || true)
            [ -n "$url" ] && break
            sleep 1
          done
          if [ -z "$url" ]; then echo "cloudflared did not report a tunnel URL"; cat cloudflared.log; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/mcp" || true)
            [ -n "$code" ] && [ "$code" != "000" ] && break
            sleep 1
          done

      # setMcpServers/describe, tool calls, auth headers, allowedTools, OAuth consent, against the real Kaltura API (production)
      - name: Resources · MCP servers
        id: live_verify_mcp
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs['mcp'] == 'true') }}
        timeout-minutes: 15
        env:
          NVP1_AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          NVP1_AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
          NVP1_AGENTIC_API_URL: https://api.avatar.us.kaltura.ai/v1
          NVP1_GENIE_URL: https://genie.nvp1.ovp.kaltura.com
          NVP1_KALTURA_API_ENDPOINT: https://www.kaltura.com/api_v3
          MCP_PUBLIC_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          set -e -o pipefail
          node scripts/live-verify-mcp.mjs --target=nvp1 --phase=provision 2>&1 | tee live-verify-mcp-provision-output.log
          node scripts/live-verify-mcp.mjs --target=nvp1 --phase=verify 2>&1 | tee live-verify-mcp-verify-output.log

      - name: Resources · MCP servers · clean up provisioned intellects
        if: ${{ always() && steps.setup.outcome == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs['mcp'] == 'true') }}
        timeout-minutes: 15
        env:
          NVP1_AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          NVP1_AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
          NVP1_AGENTIC_API_URL: https://api.avatar.us.kaltura.ai/v1
          NVP1_GENIE_URL: https://genie.nvp1.ovp.kaltura.com
          NVP1_KALTURA_API_ENDPOINT: https://www.kaltura.com/api_v3
          MCP_PUBLIC_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          set -o pipefail
          node scripts/live-verify-mcp.mjs --target=nvp1 --phase=cleanup 2>&1 | tee live-verify-mcp-cleanup-output.log

      - name: 📤 Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: live-verify-api-artifacts
          path: |
            live-verify-artifacts/
            live-verify-output.log
            live-verify-*-output.log
            mcp-server.log
            cloudflared.log
          retention-days: 30

      - name: 📝 Write job summary
        if: always()
        run: |
          if [ -f live-verify-output.log ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            {
              echo "### Smoke — ${{ steps.live_verify.outcome }}"
              echo
              echo '```'
              tail -n 40 live-verify-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f live-verify-conversation-surface-output.log ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            {
              echo "### Conversation · Push, analysis, feedback, followups, composition — ${{ steps.live_verify_conversation_surface.outcome }}"
              echo
              echo '```'
              tail -n 40 live-verify-conversation-surface-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f live-verify-threads-messages-feedback-output.log ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            {
              echo "### Conversation · Threads, messages, share, followups — ${{ steps.live_verify_threads_messages_feedback.outcome }}"
              echo
              echo '```'
              tail -n 40 live-verify-threads-messages-feedback-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f live-verify-request-vars-output.log ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            {
              echo "### Conversation · request_vars and sys__* variables — ${{ steps.live_verify_request_vars.outcome }}"
              echo
              echo '```'
              tail -n 40 live-verify-request-vars-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f live-verify-site-nav-output.log ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            {
