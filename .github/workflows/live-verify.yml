  live-verify-browser:
    name: Browser (${{ matrix.engine }})
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *' ||
      ((github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && needs.changes.outputs['group-browser'] == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    environment: live-verify
    strategy:
      fail-fast: false
      matrix:
        # The changes job picks the engines (its `engines` output): chromium for every
        # browser script, firefox for the ones that run on it, webkit for session_completed.
        #
        # firefox: Playwright's bundled headless Firefox has no H264 in
        # RTCRtpReceiver.getCapabilities('video') until its OpenH264 GMP plugin is
        # fetched (off by default in this launch profile — the SRS WHEP server only
        # serves H264 video, so without it the server answers Firefox's VP8/VP9/AV1
        # offer with `a=inactive` and no frame arrives). live-verify-browser.mjs
        # enables the GMP fetch via firefoxUserPrefs and waits (measured 20-40s
        # against Mozilla's real update service, 120s budget) before navigating.
        #
        # webkit never runs the chroma-key and mic script. Linux WebKitGTK has no
        # built-in H264 decoder, and apt-installing GStreamer's H264 plugins
        # doesn't fix it either — Playwright's WebKit build on Linux doesn't
        # decode through them, so this leg can never pass on ubuntu-26.04.
        # A macos-14 runner (real AVFoundation decode) was tried instead and
        # hit a worse, unresolved blocker: the job hangs indefinitely
        # requesting camera/mic permissions, almost certainly macOS's TCC
        # privacy prompt with no UI to dismiss headlessly. Real-Safari
        # coverage for this path is manual — see
        # manual-testing/voice-video/README.md. webkit still runs the
        # session_completed script here and in ci.yml's
        # noise-suppressor matrix (a different workflow file), since both
        # pass on it.
        engine: ${{ fromJSON(needs.changes.outputs.engines) }}
    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install ${{ matrix.engine }}
        id: setup
        run: npx playwright install --with-deps ${{ matrix.engine }}

      # Provision a real avatar → render in headless ${{ matrix.engine }} → verify chroma-key + mic audio flow → cleanup
      - name: Media · Chroma-key and mic (${{ matrix.engine }})
        id: live_verify_browser
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs['browser'] == 'true') }}
        timeout-minutes: 15
        env:
          AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
          LIVE_VERIFY_BROWSER: ${{ matrix.engine }}
        run: |
          set -o pipefail
          node scripts/live-verify-browser.mjs 2>&1 | tee live-verify-browser-output.log

      # Provision a real avatar → headless ${{ matrix.engine }} → simple (one videoEl) and split (videoEl + audioEl) layouts → readiness, placement, audio+video flow, controls, teardown → cleanup
      - name: Media · Avatar layouts (${{ matrix.engine }})
        id: live_verify_avatar_media
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs['avatar-media'] == 'true') }}
        timeout-minutes: 15
        env:
          AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
          LIVE_VERIFY_BROWSER: ${{ matrix.engine }}
        run: |
          set -o pipefail
          npm run live-verify:avatar-media 2>&1 | tee live-verify-avatar-media-output.log

      # Real conversation KS, real headless ${{ matrix.engine }}, real pagehide/visibilitychange/BroadcastChannel, real /thread/session_completed → cleanup
      - name: Session · session_completed signal (${{ matrix.engine }})
        id: live_verify_session_complete
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs['session-complete'] == 'true') }}
        timeout-minutes: 15
        env:
          AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
          LIVE_VERIFY_BROWSER: ${{ matrix.engine }}
        run: |
          set -o pipefail
          npm run live-verify:session-complete 2>&1 | tee live-verify-session-complete-output.log

      # Provision an agent with a Jinja2 opening phrase → check what landed on the intellect and avatar → voice the opening with and without requestVars → silent opening → cleanup
      - name: Session · Opening phrase and Jinja2 variables
        id: live_verify_opening_phrase
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs['opening-phrase'] == 'true') }}
        timeout-minutes: 15
        env:
          AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
        run: |
          set -o pipefail
          node scripts/live-verify-opening-phrase.mjs --env prod 2>&1 | tee live-verify-opening-phrase-output.log

      # Provision 3 agents (silent+kickoff, Jinja2, Jinja2 <blank> + kickoff) → measure connect timing (3 runs each) → check startup KPIs per arm → cleanup
      - name: Session · Startup KPIs (connect timing)
        id: live_verify_connect_timing
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs['kickoff'] == 'true') }}
        timeout-minutes: 15
        env:
          AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
        run: |
          set -o pipefail
          node scripts/live-verify-connect-timing.mjs --env prod --compare jinja --runs 9 2>&1 | tee live-verify-connect-timing-output.log

      # Provision a silent-opening agent → run the kickoff scenario matrix → cleanup
      - name: Session · Kickoff scenarios
        id: live_verify_kickoff
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs['kickoff'] == 'true') }}
        timeout-minutes: 15
        env:
          AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
        run: |
          set -o pipefail
          node scripts/live-verify-kickoff.mjs --env prod 2>&1 | tee live-verify-kickoff-output.log

      # setForcedLanguage persists force_language + agent asr.language, no base_directive marker → real headless Chromium conversation replies in the forced language → cleanup
      - name: Session · setForcedLanguage
        id: live_verify_set_forced_language
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs['set-forced-language'] == 'true') }}
        timeout-minutes: 15
        env:
          AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
        run: |
          set -o pipefail
          npm run live-verify:set-forced-language 2>&1 | tee live-verify-set-forced-language-output.log

      # Real conversation, contextId/contextType wire-payload keys + sys__context_id/sys__context_type prompt rendering, with and without context, against the real Kaltura API
      - name: Session · Context id and type fields
        id: live_verify_context_fields
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs['context-fields'] == 'true') }}
        timeout-minutes: 15
        env:
          AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
        run: |
          set -o pipefail
          npm run live-verify:context-fields 2>&1 | tee live-verify-context-fields-output.log

      - name: 📤 Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: live-verify-browser-artifacts-${{ matrix.engine }}
          path: |
            live-verify-artifacts/
            live-verify-*-output.log
          retention-days: 90

      - name: 📝 Write job summary
        if: always()
        run: |
          if [ -f live-verify-browser-output.log ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            {
              echo "### Media · Chroma-key and mic (${{ matrix.engine }}) — ${{ steps.live_verify_browser.outcome }}"
              echo
              echo '```'
              tail -n 40 live-verify-browser-output.log
              echo '```'
              shot=$(ls -t live-verify-artifacts/ci-live-verify-browser-*.png 2>/dev/null | head -n 1 || true)
              if [ -n "$shot" ]; then
                echo
                echo "Composited chroma-key output ($shot):"
                echo
                b64=$(base64 -w 0 "$shot" 2>/dev/null || base64 "$shot")
                echo "![chroma-key composited output](data:image/png;base64,$b64)"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f live-verify-avatar-media-output.log ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            {
              echo "### Media · Avatar layouts (${{ matrix.engine }}) — ${{ steps.live_verify_avatar_media.outcome }}"
              echo
              echo '```'
              tail -n 40 live-verify-avatar-media-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f live-verify-session-complete-output.log ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            {
              echo "### Session · session_completed signal (${{ matrix.engine }}) — ${{ steps.live_verify_session_complete.outcome }}"
              echo
              echo '```'
              tail -n 60 live-verify-session-complete-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f live-verify-opening-phrase-output.log ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            {
              echo "### Session · Opening phrase and Jinja2 variables — ${{ steps.live_verify_opening_phrase.outcome }}"
              echo
              for md in live-verify-artifacts/opening-phrase-*.md; do
                [ -f "$md" ] && cat "$md" && echo
              done
              echo '```'
              tail -n 40 live-verify-opening-phrase-output.log 2>/dev/null || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f live-verify-connect-timing-output.log ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            {
              echo "### Silent opening + kickoff — timing ${{ steps.live_verify_connect_timing.outcome }}, scenarios ${{ steps.live_verify_kickoff.outcome }}"
              echo
              echo "#### Startup KPIs (prod, headless Chromium, median ms per arm, cell = median ≤ budget result; a miss fails the timing step)"
              echo
              node -e '
                const fs = require("node:fs");
                const dir = "live-verify-artifacts";
                const files = fs.existsSync(dir) ? fs.readdirSync(dir).filter((f) => /^connect-timing-.*\.json$/.test(f)).sort() : [];
                if (!files.length) { console.log("No connect-timing report was written."); process.exit(0); }
                const arms = JSON.parse(fs.readFileSync(dir + "/" + files.at(-1), "utf8")).data?.compare?.arms ?? {};
                const names = Object.keys(arms);
                if (!names.length) { console.log("The connect-timing report has no per-arm results."); process.exit(0); }
                const labels = arms[names[0]].kpi.map((k) => k.label);
                console.log("| arm | runs | " + labels.join(" | ") + " |");
                console.log("|---|---|" + labels.map(() => "---|").join(""));
                for (const name of names) {
                  const cells = arms[name].kpi.map((k) => (k.medianMs ?? "n/a") + " ≤ " + k.budgetMs + " " + k.status);
                  console.log("| " + [name, arms[name].runs, ...cells].join(" | ") + " |");
                }
              ' 2>/dev/null || echo "Could not read the connect-timing report."
              echo
              echo "<details><summary>Full reports</summary>"
              echo
              for md in live-verify-artifacts/connect-timing-*.md live-verify-artifacts/kickoff-*.md; do
                [ -f "$md" ] && cat "$md" && echo
              done
              echo '```'
              tail -n 40 live-verify-kickoff-output.log 2>/dev/null || true
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f live-verify-set-forced-language-output.log ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            {
              echo "### Session · setForcedLanguage — ${{ steps.live_verify_set_forced_language.outcome }}"
              echo
              echo '```'
              tail -n 40 live-verify-set-forced-language-output.log
              echo '```'
              shot=$(ls -t live-verify-artifacts/set-forced-language-runtime-check-*.png 2>/dev/null | head -n 1 || true)
              if [ -n "$shot" ]; then
                echo
                echo "Forced-language conversation ($shot):"
                echo
                b64=$(base64 -w 0 "$shot" 2>/dev/null || base64 "$shot")
                echo "![forced-language conversation](data:image/png;base64,$b64)"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f live-verify-context-fields-output.log ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            {
              echo "### Session · Context id and type fields — ${{ steps.live_verify_context_fields.outcome }}"
              echo
              echo '```'
              tail -n 40 live-verify-context-fields-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # The one required status check for live verification (branch protection:
  # "Live verification"). It waits for every live job, then:
  #   - fails if any live job failed or was cancelled,
  #   - fails a fork PR that touches live-tested paths (no secrets there), and
  #   - fails if a job mapped to a changed path did not succeed (a `skipped`
  #     job would otherwise pass the check and let live-tested code merge
  #     unverified).
  # A Dependabot PR passes with a notice. Jobs whose paths did not change stay
  # skipped and neutral.
  live-verify-gate:
    name: Live verification
    needs: [changes, live-verify-api, live-verify-browser]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every live job that ran passed, and every job mapped to a changed path ran
        env:
          NEEDS: ${{ toJSON(needs) }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          IS_DEPENDABOT: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: |
          bad=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key): \(.value.result)"' <<<"$NEEDS")
          if [ -n "$bad" ]; then
            echo "::error::Live jobs did not pass:"
            echo "$bad"
            exit 1
          fi
          touched=$(jq -r '[.changes.outputs["group-api"], .changes.outputs["group-browser"]] | any(. == "true")' <<<"$NEEDS")
          if [ "$touched" = true ] && [ "$IS_DEPENDABOT" = true ]; then
            echo "::notice::Dependabot PRs get no live secrets. The nightly run verifies this change after merge."
            exit 0
          fi
          if [ "$touched" = true ] && [ "$IS_FORK" = true ]; then
            echo "::error::This fork PR changes paths covered by live verification, and GitHub gives fork PRs no secrets. A maintainer opens a replacement PR from a branch in this repo to run the live jobs."
            exit 1
          fi
          not_run=$(jq -r '. as $n | ["api","browser"][] | select($n.changes.outputs["group-" + .] == "true") | "live-verify-" + . | select($n[.].result != "success") | "\(.): \($n[.].result)"' <<<"$NEEDS")
          if [ -n "$not_run" ]; then
            echo "::error::Live jobs mapped to changed paths did not succeed:"
            echo "$not_run"
            exit 1
          fi
          echo "Live verification OK (touched=$touched)."
