name: Live verification

# Runs a real, credentialed smoke test against the live Kaltura API — session
# mint, one converse turn, cleanup. Everything ci.yml runs is offline (fakes
# inject fetch/socket/RTC); this is the one workflow that actually touches
# the backend with AGENTIC_* secrets, so it never runs on every push/PR:
#
#   - workflow_dispatch: manual, on demand.
#   - pull_request: only when the PR carries the `run-live-verify` label —
#     an untrusted fork PR can't add that label to itself, so opening a PR
#     alone can never exfiltrate secrets through this job.
#
# The job is also gated on the `live-verify` GitHub Environment, so the
# AGENTIC_* secrets are scoped to it, not available repo-wide.
#
# Known gap: this covers the server-side management/conversation path only.
# A true live-*browser* test (WebRTC/WHEP via KalturaAvatarSession) needs a
# headed Playwright job with real media devices — a bigger, separate lift,
# deliberately not half-built here.
#
# Also runs on merge_group so it's a required check on the merge queue —
# every merge into main gets one real live-API round trip before it lands,
# not just PRs someone remembered to label.
on:
  workflow_dispatch: {}
  pull_request:
    types: [labeled]
  merge_group:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: live-verify
  cancel-in-progress: false

jobs:
  live-verify:
    name: 🔴 Live verification
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || github.event.label.name == 'run-live-verify'
    runs-on: ubuntu-latest
    environment: live-verify
    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: 🔴 Session creation → one converse turn → cleanup, against the real Kaltura API
        id: live_verify
        env:
          AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
        run: |
          set -o pipefail
          node scripts/live-verify.mjs 2>&1 | tee live-verify-output.log

      - name: 📤 Upload live-verify artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: live-verify-artifacts
          path: |
            live-verify-artifacts/
            live-verify-output.log
          retention-days: 30

      - name: 📝 Write job summary
        if: always()
        run: |
          {
            echo "### 🔴 Live verification — ${{ steps.live_verify.outcome }}"
            echo
            echo '```'
            tail -n 40 live-verify-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
