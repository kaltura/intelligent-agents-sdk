              - 'src/management/client.js'
              - 'src/core/http.js'
              - 'src/core/errors.js'
              - 'src/core/session.js'
              - 'src/core/ids.js'
              - 'src/core/redact.js'
              - '.github/workflows/live-verify.yml'
            capabilities:
