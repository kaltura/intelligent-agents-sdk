      # One flag per job, so the PR checks list shows API, Browser (one row per
      # engine) and the gate instead of one row per script. Each script is a step
      # inside those jobs and reads its own flag above. Manual and nightly runs
      # (`all`) switch every step on.
      - name: 🧮 Group the flags per job
        id: groups
        env:
          FLAGS: ${{ toJSON(steps.filter.outputs) }}
          RUN_ALL: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *' }}
        run: |
          has() { [ "$RUN_ALL" = true ] || [ "$(jq -r --arg k "$1" '.[$k]' <<<"$FLAGS")" = true ]; }
          any() { local k; for k in "$@"; do has "$k" && return 0; done; return 1; }
          api=false
          any smoke conversation-surface threads-messages-feedback request-vars site-nav session-types capabilities agents avatars catalog intellects-conversations knowledge skills tools mcp && api=true
          engines=()
          any browser avatar-media session-complete opening-phrase kickoff set-forced-language context-fields && engines+=(chromium)
          any browser avatar-media session-complete && engines+=(firefox)
          any session-complete && engines+=(webkit)
          browser=false
          [ "${#engines[@]}" -gt 0 ] && browser=true
          {
            echo "all=$RUN_ALL"
            echo "api=$api"
            echo "browser=$browser"
            echo "engines=$(jq -nc '$ARGS.positional' --args "${engines[@]}")"
          } >> "$GITHUB_OUTPUT"

  live-verify-api:
    name: API
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *' ||
      ((github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && needs.changes.outputs['group-api'] == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: live-verify
    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: 📦 Install dependencies
        id: setup
        run: npm ci

      # Session creation → one converse turn → cleanup, against the real Kaltura API
      - name: Smoke
        id: live_verify
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs['smoke'] == 'true') }}
        timeout-minutes: 15
        env:
          AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
        run: |
          set -o pipefail
          node scripts/live-verify.mjs 2>&1 | tee live-verify-output.log

      # Threads#push/setAnalysis/clearAnalysis, Feedback#add/list/report, Followups#list, Avatars#create/update (face+background, templateId+background), Catalog#createFace/createBackground, against the real Kaltura API
      - name: Conversation · Push, analysis, feedback, followups, composition
        id: live_verify_conversation_surface
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs['conversation-surface'] == 'true') }}
        timeout-minutes: 15
        env:
          AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
        run: |
          set -o pipefail
          npm run live-verify:conversation-surface 2>&1 | tee live-verify-conversation-surface-output.log

      # Scratch thread via converse → get/rename/transcript, messages.list/share, feedback.add, followups.getSuggested → delete → cleanup, against the real Kaltura API
      - name: Conversation · Threads, messages, share, followups
        id: live_verify_threads_messages_feedback
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs['threads-messages-feedback'] == 'true') }}
        timeout-minutes: 15
        env:
          AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
        run: |
          set -o pipefail
          npm run live-verify:threads-messages-feedback 2>&1 | tee live-verify-threads-messages-feedback-output.log

      # Per-thread request_vars persistence/merge, tool-template interpolation, sys__* injection, large page_context, fresh-thread scope reset, against the real Kaltura API
      - name: Conversation · request_vars and sys__* variables
        id: live_verify_request_vars
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs['request-vars'] == 'true') }}
        timeout-minutes: 15
        env:
          AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
        run: |
          set -o pipefail
          npm run live-verify:request-vars 2>&1 | tee live-verify-request-vars-output.log

      # goToTool echo → idempotent update → SITE MAP intellect → one mapped go_to → zero unmapped go_to → cleanup, against the real Kaltura API
      - name: Conversation · go_to site navigation
        id: live_verify_site_nav
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs['site-nav'] == 'true') }}
        timeout-minutes: 15
        env:
          AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
        run: |
          set -o pipefail
          npm run live-verify:site-nav 2>&1 | tee live-verify-site-nav-output.log

      # User vs admin session reach per token kind, no-userId and widget shared identity, persona, per-user appInit, revoke → cleanup, against the real Kaltura API
      - name: Conversation · Session types and token reach
        id: live_verify_session_types
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs['session-types'] == 'true') }}
        timeout-minutes: 15
        env:
          AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
        run: |
          set -o pipefail
          npm run live-verify:session-types 2>&1 | tee live-verify-session-types-output.log

      # Knowledge#listRecords, Application#getCustomPrompts, Avatars#listTemplates, Lifecycle create→get/list→match→update→delete, against the real Kaltura API
      - name: Resources · Read paths and lifecycle
        id: live_verify_capabilities
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs['capabilities'] == 'true') }}
        timeout-minutes: 15
        env:
