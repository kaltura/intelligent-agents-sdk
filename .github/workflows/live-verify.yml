              echo '```'
              tail -n 40 live-verify-site-nav-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f live-verify-session-types-output.log ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            {
