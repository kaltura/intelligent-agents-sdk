          AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
        run: |
          set -o pipefail
          npm run live-verify:capabilities 2>&1 | tee live-verify-capabilities-output.log

      # Scratch intellect + avatar → agents create/get/list/update(rename)/delete → cleanup, against the real Kaltura API
      - name: Resources · Agents
        id: live_verify_agents
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs['agents'] == 'true') }}
