        run: |
          {
            echo "### 🔴 Live verification (Knowledge/Application/Avatars/Lifecycle) — ${{ steps.live_verify_capabilities.outcome }}"
            echo
            echo '```'
            tail -n 40 live-verify-capabilities-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  live-verify-conversation-surface:
    name: 🔴 Live verification (Threads/Feedback/Followups/Avatars composition/Catalog Face+Background)
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *' ||
      ((github.event_name == 'merge_group' || contains(github.event.pull_request.labels.*.name, 'run-live-verify')) && needs.changes.outputs['conversation-surface'] == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: live-verify
    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: 🔴 Threads#push/setAnalysis/clearAnalysis, Feedback#add/list/report, Followups#list, Avatars#create/update (face+background, templateId+background), Catalog#createFace/createBackground, against the real Kaltura API
