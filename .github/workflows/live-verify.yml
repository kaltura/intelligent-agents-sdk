  live-verify-mcp:
    name: 🔴 Live verification (MCP server integration)
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *' ||
      ((github.event_name == 'merge_group' || contains(github.event.pull_request.labels.*.name, 'run-live-verify')) && needs.changes.outputs['mcp'] == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: live-verify
    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: 🚇 Install cloudflared
        run: |
          curl -sSfL -o cloudflared https://github.com/cloudflare/cloudflared/releases/download/2026.9.3/cloudflared-linux-amd64
          echo "77e26d8d900e0b8469f416239d14b5f296525fdf79fee6f511ef55609e3fbac2  cloudflared" | sha256sum -c -
          sudo install -m 0755 cloudflared /usr/local/bin/cloudflared

      - name: 🟢 Start the reference MCP server
        run: |
          node examples/mcp-live-showcase/server.mjs > mcp-server.log 2>&1 &
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8877/mcp || true)
            [ -n "$code" ] && [ "$code" != "000" ] && break
            sleep 0.5
          done

      - name: 🚇 Open a cloudflared quick tunnel and capture its public URL
        id: tunnel
        run: |
          cloudflared tunnel --url http://localhost:8877 > cloudflared.log 2>&1 &
          url=""
          for i in $(seq 1 30); do
            url=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' cloudflared.log | head -n1 || true)
            [ -n "$url" ] && break
            sleep 1
          done
          if [ -z "$url" ]; then echo "cloudflared did not report a tunnel URL"; cat cloudflared.log; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/mcp" || true)
            [ -n "$code" ] && [ "$code" != "000" ] && break
            sleep 1
          done

      - name: 🔴 setMcpServers/describe, tool calls, auth headers, allowedTools, OAuth consent, against the real Kaltura API (production)
        id: live_verify_mcp
        env:
          NVP1_AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          NVP1_AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
          NVP1_AGENTIC_API_URL: https://api.avatar.us.kaltura.ai/v1
          NVP1_GENIE_URL: https://genie.nvp1.ovp.kaltura.com
          NVP1_KALTURA_API_ENDPOINT: https://www.kaltura.com/api_v3
          MCP_PUBLIC_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          set -e -o pipefail
          node scripts/live-verify-mcp.mjs --target=nvp1 --phase=provision 2>&1 | tee live-verify-mcp-provision-output.log
          node scripts/live-verify-mcp.mjs --target=nvp1 --phase=verify 2>&1 | tee live-verify-mcp-verify-output.log

      - name: 🧹 Clean up provisioned intellects
        if: always()
        env:
          NVP1_AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          NVP1_AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
          NVP1_AGENTIC_API_URL: https://api.avatar.us.kaltura.ai/v1
          NVP1_GENIE_URL: https://genie.nvp1.ovp.kaltura.com
          NVP1_KALTURA_API_ENDPOINT: https://www.kaltura.com/api_v3
          MCP_PUBLIC_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          set -o pipefail
          node scripts/live-verify-mcp.mjs --target=nvp1 --phase=cleanup 2>&1 | tee live-verify-mcp-cleanup-output.log

      - name: 📤 Upload live-verify-mcp artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: live-verify-mcp-artifacts
          path: |
            live-verify-artifacts/
            live-verify-mcp-*-output.log
            mcp-server.log
            cloudflared.log
          retention-days: 30

      - name: 📝 Write job summary
        if: always()
        run: |
          {
            echo "### 🔴 Live verification (MCP server integration) — ${{ steps.live_verify_mcp.outcome }}"
            echo
            echo '```'
            tail -n 60 live-verify-mcp-verify-output.log 2>/dev/null || tail -n 60 live-verify-mcp-provision-output.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The one required status check for live verification (branch protection:
  # "🔴 Live verification"). It waits for every live job, then:
  #   - fails if any live job failed or was cancelled,
  #   - fails if a job mapped to a changed path did not succeed (a `skipped`
  #     job would otherwise pass the check and let live-tested code merge
  #     unverified), and
  #   - fails a PR that touches live-tested paths without the
  #     `run-live-verify` label.
  # Jobs whose paths did not change stay skipped and neutral.
  live-verify-gate:
    name: 🔴 Live verification
    needs: [changes, live-verify, live-verify-capabilities, live-verify-conversation-surface, live-verify-request-vars, live-verify-context-fields, live-verify-site-nav, live-verify-threads-messages-feedback, live-verify-session-types, live-verify-skills, live-verify-catalog, live-verify-knowledge, live-verify-avatars, live-verify-agents, live-verify-browser, live-verify-kickoff, live-verify-opening-phrase, live-verify-avatar-media, live-verify-set-forced-language, live-verify-session-complete, live-verify-intellects-conversations, live-verify-tools, live-verify-mcp]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 🔴 Every live job that ran passed, and a PR touching live-tested paths carries the label
        env:
          NEEDS: ${{ toJSON(needs) }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'run-live-verify') }}
        run: |
          bad=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key): \(.value.result)"' <<<"$NEEDS")
          if [ -n "$bad" ]; then
            echo "::error::Live jobs did not pass:"
            echo "$bad"
            exit 1
          fi
          touched=$(jq -r '[.changes.outputs[]] | any(. == "true")' <<<"$NEEDS")
          if [ "$IS_PR" = true ] && [ "$touched" = true ] && [ "$LABELED" != true ]; then
            echo "::error::This PR changes paths covered by live verification. A maintainer must add the 'run-live-verify' label, then this check re-runs the matching live jobs."
            exit 1
          fi
          not_run=$(jq -r '. as $n | $n.changes.outputs | to_entries[] | select(.value == "true") | (if .key == "smoke" then "live-verify" else "live-verify-" + .key end) as $j | select($n[$j].result != "success") | "\($j): \($n[$j].result)"' <<<"$NEEDS")
          if [ -n "$not_run" ]; then
            echo "::error::Live jobs mapped to changed paths did not succeed:"
            echo "$not_run"
            exit 1
          fi
          echo "Live verification OK (touched=$touched, labeled=$LABELED)."
