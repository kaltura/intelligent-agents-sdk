name: Live verification

# Runs a real, credentialed smoke test against the live Kaltura API — session
# mint, one converse turn, cleanup. Everything ci.yml runs is offline (fakes
# inject fetch/socket/RTC); this is the one workflow that actually touches
# the backend with AGENTIC_* secrets, so its jobs only ever EXECUTE when:
#
#   - workflow_dispatch: manual, on demand.
#   - pull_request: automatically, for PRs from a branch in this repo. The
#     path filter picks the jobs, so the author does nothing. A fork PR gets no
#     secrets from GitHub and a Dependabot PR gets only Dependabot secrets, so
#     opening a PR alone can never exfiltrate secrets through this job. Both are
#     treated as untrusted, see the gate below.
#   - merge_group: every merge into main gets one real live-API round trip
#     before it lands, not just PRs someone remembered to label.
#
# The job is also gated on the `live-verify` GitHub Environment, so the
# AGENTIC_* secrets are scoped to it, not available repo-wide.
#
# "Live verification" is the required status check on main. It is the last job
# in this file (`live-verify-gate`): it waits for every live job and fails if
# any of them failed, or if a job mapped to a changed path did not succeed. A
# fork PR that touches live-tested paths fails it, because no live job can run
# there: a maintainer opens a replacement PR from a branch in this repo to run
# them. A Dependabot PR passes with a notice and relies on the nightly run. A
# docs-only PR touches no live path, so every live job is skipped and the gate
# passes.
#
# The `changes` job below computes one path-filter output per live-verify job
# (not one blanket filter for all of them), scoped to that job's own script
# plus the specific src/** files it actually exercises, plus a handful of
# files every job depends on regardless (src/management/client.js, src/core/
# http.js|errors.js|session.js|ids.js|redact.js, package.json,
# package-lock.json, this workflow file). A change to one feature's source or
# script only triggers that feature's job, not the whole fleet — except for
# those shared dependency files, which correctly still trigger everything.
#
# A dedicated nightly `schedule` run (see the cron below) bypasses the
# path filters entirely and runs every job in the fleet regardless of what
# changed, so drift between the live backend and this suite surfaces within a
# day even on a week with no merges.
#
# The live-verify job covers the server-side management/conversation path
# only. live-verify-browser (below) covers the actual browser/WebRTC path:
# a real provisioned avatar, a headless Chromium with fake-but-real-pipeline
# media flags, and a real chroma-key compositor — see scripts/live-verify-browser.mjs.
# live-verify-avatar-media covers the avatar downlink media path itself
# (src/experience/avatar-media.js) in both layouts, simple (one videoEl) and
# split (videoEl + audioEl): readiness ordering, track placement, real audio and
# video flow, output controls, clean teardown — see scripts/live-verify-avatar-media.mjs.
# live-verify-session-complete covers the `session_completed` lifecycle signal
# (KalturaChatSession's disconnect/tab-close/backgrounding/cross-tab-presence
# mechanism) with a real conversation KS and real browser-native
# pagehide/visibilitychange/BroadcastChannel, matrixed across Chromium,
# Firefox and WebKit — see scripts/live-verify-session-complete.mjs. Real
# mobile OS backgrounding/tab-kill behavior isn't reachable from any
# Playwright engine; see manual-testing/session-complete/ for that.
# live-verify-kickoff covers the silent-opening + `kickoff` startup pattern
# end to end against a real provisioned agent: connect timing over several
# runs (scripts/live-verify-connect-timing.mjs) and the scenario matrix in
# scripts/live-verify-kickoff.mjs (echo, disclosure ack, pause/resume,
# reconnect, agent-session mode switch, denied/deferred mic, spoken opening,
# barge-in). Both scripts take --browser chromium|chrome|firefox|webkit; CI
# runs headless Chromium. Audibility is measured on the remote audio track
# with an AnalyserNode, so it works on every engine; the inbound-rtp
# totalAudioEnergy check is added only where the engine exposes it.
# The timing script is also the startup-KPI gate. CI runs it with
# `--compare jinja --runs 9`: three agents (silent+kickoff, a Jinja2 opening,
# a Jinja2 `<blank>` opening + kickoff echo), 3 runs each. Each arm's median
# connect(), first video frame, first audio, first agent words and sound heard
# is checked against that arm's budgets in the script header, and a miss fails
# the timing step. The job summary leads with one KPI row per arm; the full reports
# sit below it in a collapsed section. The nightly `schedule` run keeps a
# trend (90-day artifacts) even when nothing is merged.
# live-verify-opening-phrase covers the intellect-owned opening phrase:
# provision() writes it to the intellect only and leaves the avatar's unset, a
# Jinja2 `{% if %}` template renders per session from client variables
# (`requestVars`), SILENT_OPENING on the intellect alone gives a silent
# opening turn, a `<blank>` branch + kickoff asks a preset question, and each
# re-join replays the opening (sys__is_new_thread, a var cleared with '').
# See scripts/live-verify-opening-phrase.mjs.
# live-verify-mcp covers setMcpServers/describe end to end against a real,
# CI-hosted reference MCP server (examples/mcp-live-showcase/server.mjs),
# exposed over a cloudflared quick tunnel so the real backend can call back
# into it: basic tool calls, shared and per-attendee auth headers,
# allowedTools restriction, two servers with no tool-name collision, an
# unreachable server not blocking the rest of the conversation, a client-side
# tool timeout, a stateful tool's state persisting correctly across calls, a
# tool-level failure (isError:true) not breaking the turn, the OAuth
# DCR+PKCE consent flow (text and avatar), and one call against a
# pre-existing, independently-run public MCP server. See
# scripts/live-verify-mcp.mjs.
# live-verify-session-types covers what each token kind can reach: user vs
# admin session thread reach, OVP reach, the shared identity of a no-userId
# or widget token, the agent persona, per-user appInit and revoke. See
# scripts/live-verify-session-types.mjs.
# Layout. The PR checks list is flat (one row per job), so the scripts are steps
# inside three jobs: `live-verify-api` (server-side scripts, one step each),
# `live-verify-browser` (browser scripts, one job per engine) and the gate. The
# step groups below are still called by their old names (live-verify-kickoff,
# live-verify-mcp, ...): each one is a script plus the path filter named after it
# in the `changes` job. A step runs when its filter is true or on a manual or
# nightly run; every step runs even if an earlier one failed, and the job
# fails if any did. Open a run to see each step.
on:
  workflow_dispatch: {}
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    branches: [main]
  schedule:
    - cron: '0 3 * * *' # Nightly 03:00 UTC: full live-verify suite, regardless of what changed

permissions:
  contents: read

# One global group on purpose: these jobs drive real conversations against a
# shared partner, so two runs at once would fight over the same agents. The
# cost is that a stuck run blocks every other one, which is why every job below
# carries a `timeout-minutes` and every page-side session call in the scripts
# has its own deadline (scripts/live-verify-hooks-shared.mjs).
concurrency:
  group: live-verify
  cancel-in-progress: false

jobs:
  changes:
    name: Setup · Detect changed paths
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      smoke: ${{ steps.filter.outputs.smoke }}
      capabilities: ${{ steps.filter.outputs.capabilities }}
      conversation-surface: ${{ steps.filter.outputs.conversation-surface }}
      request-vars: ${{ steps.filter.outputs.request-vars }}
      context-fields: ${{ steps.filter.outputs.context-fields }}
      site-nav: ${{ steps.filter.outputs.site-nav }}
      threads-messages-feedback: ${{ steps.filter.outputs.threads-messages-feedback }}
      session-types: ${{ steps.filter.outputs.session-types }}
      skills: ${{ steps.filter.outputs.skills }}
      catalog: ${{ steps.filter.outputs.catalog }}
      knowledge: ${{ steps.filter.outputs.knowledge }}
      avatars: ${{ steps.filter.outputs.avatars }}
      agents: ${{ steps.filter.outputs.agents }}
      browser: ${{ steps.filter.outputs.browser }}
      kickoff: ${{ steps.filter.outputs.kickoff }}
      opening-phrase: ${{ steps.filter.outputs.opening-phrase }}
      avatar-media: ${{ steps.filter.outputs.avatar-media }}
      set-forced-language: ${{ steps.filter.outputs.set-forced-language }}
      session-complete: ${{ steps.filter.outputs.session-complete }}
      intellects-conversations: ${{ steps.filter.outputs.intellects-conversations }}
      tools: ${{ steps.filter.outputs.tools }}
      mcp: ${{ steps.filter.outputs.mcp }}
      all: ${{ steps.groups.outputs.all }}
      group-api: ${{ steps.groups.outputs.api }}
      group-browser: ${{ steps.groups.outputs.browser }}
      engines: ${{ steps.groups.outputs.engines }}
    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🔍 Which live-verify jobs does this change actually touch?
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            smoke:
              - 'scripts/live-verify.mjs'
              - 'src/management/agents.js'
              - 'src/management/avatars.js'
              - 'src/management/intellects.js'
              - 'src/management/provision.js'
              - 'src/management/client.js'
              - 'src/core/http.js'
              - 'src/core/errors.js'
              - 'src/core/session.js'
              - 'src/core/ids.js'
              - 'src/core/redact.js'
              - '.github/workflows/live-verify.yml'
            capabilities:
