name: Live verification

# Runs a real, credentialed smoke test against the live Kaltura API — session
# mint, one converse turn, cleanup. Everything ci.yml runs is offline (fakes
# inject fetch/socket/RTC); this is the one workflow that actually touches
# the backend with AGENTIC_* secrets, so its jobs only ever EXECUTE when:
#
#   - workflow_dispatch: manual, on demand.
#   - pull_request: only when the PR carries the `run-live-verify` label —
#     an untrusted fork PR can't add that label to itself, so opening a PR
#     alone can never exfiltrate secrets through this job.
#   - merge_group: every merge into main gets one real live-API round trip
#     before it lands, not just PRs someone remembered to label.
#
# The job is also gated on the `live-verify` GitHub Environment, so the
# AGENTIC_* secrets are scoped to it, not available repo-wide.
#
# "Live verification" is a required status check on main, so it needs a
# reported status on every PR's head SHA — not just the label/merge_group
# runs above. `pull_request: [opened, synchronize, reopened]` gives it that:
# the workflow runs on every PR push, but its jobs' `if:` still only executes
# on label/merge_group/dispatch, so a plain PR push reports `skipped` (which
# satisfies a required check) instead of never reporting at all and leaving
# the check stuck on "waiting for status to be reported" until someone labels
# it or the merge queue picks it up. This also means the same `code`
# path-filter below correctly resolves to skipped for a docs-only PR — it has
# nothing to verify against the real backend either way.
#
# live-verify-browser gates on its own narrower `browser` path-filter output,
# not `code` — it only needs to run when something that actually affects the
# browser/WebRTC path changed (src/experience/**, examples/**, its own
# script, package.json/package-lock.json, or this workflow file), not on
# every merge that touches src/**.
#
# The live-verify job covers the server-side management/conversation path
# only. live-verify-browser (below) covers the actual browser/WebRTC path:
# a real provisioned avatar, a headless Chromium with fake-but-real-pipeline
# media flags, and a real chroma-key compositor — see scripts/live-verify-browser.mjs.
# live-verify-session-complete covers the `session_completed` lifecycle signal
# (KalturaChatSession's disconnect/tab-close/backgrounding/cross-tab-presence
# mechanism) with a real conversation KS and real browser-native
# pagehide/visibilitychange/BroadcastChannel, matrixed across Chromium,
# Firefox and WebKit — see scripts/live-verify-session-complete.mjs. Real
# mobile OS backgrounding/tab-kill behavior isn't reachable from any
# Playwright engine; see manual-testing/session-complete/ for that.
on:
  workflow_dispatch: {}
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: live-verify
  cancel-in-progress: false

jobs:
  changes:
    name: 🔍 Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      browser: ${{ steps.filter.outputs.browser }}
    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🔍 Does this push/PR touch anything other than docs?
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            code:
              - 'src/**'
              - 'test/**'
              - 'scripts/**'
              - 'tools/**'
              - 'examples/**'
              - 'package.json'
              - 'package-lock.json'
              - 'jsconfig.json'
              - '.eslintrc*'
              - 'eslint.config.*'
              - '.github/workflows/**'
            browser:
              - 'src/experience/**'
              - 'examples/**'
              - 'scripts/live-verify-browser.mjs'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/live-verify.yml'

  live-verify:
    name: 🔴 Live verification
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'merge_group' || github.event.label.name == 'run-live-verify') && needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    environment: live-verify
    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: 🔴 Session creation → one converse turn → cleanup, against the real Kaltura API
        id: live_verify
        env:
          AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
        run: |
          set -o pipefail
          node scripts/live-verify.mjs 2>&1 | tee live-verify-output.log

      - name: 📤 Upload live-verify artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: live-verify-artifacts
          path: |
            live-verify-artifacts/
            live-verify-output.log
          retention-days: 30

      - name: 📝 Write job summary
        if: always()
        run: |
          {
            echo "### 🔴 Live verification — ${{ steps.live_verify.outcome }}"
            echo
            echo '```'
            tail -n 40 live-verify-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  live-verify-capabilities:
    name: 🔴 Live verification (Knowledge/Application/Avatars/Lifecycle)
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'merge_group' || github.event.label.name == 'run-live-verify') && needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    environment: live-verify
    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: 🔴 Knowledge#listRecords, Application#getCustomPrompts, Avatars#listTemplates, Lifecycle create→get/list→match→update→delete, against the real Kaltura API
        id: live_verify_capabilities
        env:
          AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
        run: |
          set -o pipefail
          npm run live-verify:capabilities 2>&1 | tee live-verify-capabilities-output.log

      - name: 📤 Upload live-verify-capabilities artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: live-verify-capabilities-artifacts
          path: |
            live-verify-artifacts/
            live-verify-capabilities-output.log
          retention-days: 30

      - name: 📝 Write job summary
        if: always()
        run: |
          {
            echo "### 🔴 Live verification (Knowledge/Application/Avatars/Lifecycle) — ${{ steps.live_verify_capabilities.outcome }}"
            echo
            echo '```'
            tail -n 40 live-verify-capabilities-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  live-verify-browser:
    name: 🔴🌐 Live browser verification (${{ matrix.engine }})
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'merge_group' || github.event.label.name == 'run-live-verify') && needs.changes.outputs.browser == 'true')
    runs-on: ubuntu-latest
    environment: live-verify
    strategy:
      fail-fast: false
      matrix:
        # firefox: Playwright's bundled headless Firefox has no H264 in
        # RTCRtpReceiver.getCapabilities('video') until its OpenH264 GMP plugin is
        # fetched (off by default in this launch profile — the SRS WHEP server only
        # serves H264 video, so without it the server answers Firefox's VP8/VP9/AV1
        # offer with `a=inactive` and no frame arrives). live-verify-browser.mjs
        # enables the GMP fetch via firefoxUserPrefs and waits (measured 20-40s
        # against Mozilla's real update service, 120s budget) before navigating.
        #
        # webkit is known to fail here and is left in the matrix anyway so the
        # failure stays visible rather than silently dropped. Root cause confirmed
        # by real CI runs: Linux WebKitGTK has no built-in H264 decoder, and
        # apt-installing GStreamer's H264 plugins doesn't fix it either —
        # Playwright's WebKit build on Linux doesn't decode through them. Running
        # this leg on a macos-14 runner instead (which decodes H264 natively via
        # AVFoundation) was tried and hit a different, worse blocker: the job hung
        # indefinitely requesting camera/mic permissions, almost certainly macOS's
        # TCC privacy prompt with no UI to dismiss headlessly. Real-Safari coverage
        # for this path is manual — see manual-testing/voice-video/README.md.
        engine: [chromium, firefox, webkit]
    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install ${{ matrix.engine }}
        run: npx playwright install --with-deps ${{ matrix.engine }}

      - name: 🔴🌐 Provision a real avatar → render in headless ${{ matrix.engine }} → verify chroma-key + mic audio flow → cleanup
        id: live_verify_browser
        env:
          AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
          LIVE_VERIFY_BROWSER: ${{ matrix.engine }}
        run: |
          set -o pipefail
          node scripts/live-verify-browser.mjs 2>&1 | tee live-verify-browser-output.log

      - name: 📤 Upload live-verify-browser artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: live-verify-browser-artifacts-${{ matrix.engine }}
          path: |
            live-verify-artifacts/
            live-verify-browser-output.log
          retention-days: 30

      - name: 📝 Write job summary (with embedded screenshot)
        if: always()
        run: |
          {
            echo "### 🔴🌐 Live browser verification (${{ matrix.engine }}) — ${{ steps.live_verify_browser.outcome }}"
            echo
            echo '```'
            tail -n 40 live-verify-browser-output.log
            echo '```'
            shot=$(ls -t live-verify-artifacts/*.png 2>/dev/null | head -n 1 || true)
            if [ -n "$shot" ]; then
              echo
              echo "Composited chroma-key output ($shot):"
              echo
              b64=$(base64 -w 0 "$shot" 2>/dev/null || base64 "$shot")
              echo "![chroma-key composited output](data:image/png;base64,$b64)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  live-verify-session-complete:
    name: 🔴🌐 Live verification (session_completed signal, ${{ matrix.engine }})
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'merge_group' || github.event.label.name == 'run-live-verify') && needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    environment: live-verify
    strategy:
      fail-fast: false
      matrix:
        # webkit here is desktop Safari's engine, not iOS Safari — real mobile
        # OS backgrounding/tab-kill behavior isn't reachable from any Playwright
        # engine, see manual-testing/session-complete/ for that coverage.
        engine: [chromium, firefox, webkit]
    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install ${{ matrix.engine }}
        run: npx playwright install --with-deps ${{ matrix.engine }}

      - name: 🔴🌐 Real conversation KS, real headless ${{ matrix.engine }}, real pagehide/visibilitychange/BroadcastChannel, real /thread/session_completed → cleanup
        id: live_verify_session_complete
        env:
          AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
          LIVE_VERIFY_BROWSER: ${{ matrix.engine }}
        run: |
          set -o pipefail
          npm run live-verify:session-complete 2>&1 | tee live-verify-session-complete-output.log

      - name: 📤 Upload live-verify-session-complete artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: live-verify-session-complete-artifacts-${{ matrix.engine }}
          path: |
            live-verify-artifacts/
            live-verify-session-complete-output.log
          retention-days: 30

      - name: 📝 Write job summary
        if: always()
        run: |
          {
            echo "### 🔴🌐 Live verification (session_completed signal, ${{ matrix.engine }}) — ${{ steps.live_verify_session_complete.outcome }}"
            echo
            echo '```'
            tail -n 60 live-verify-session-complete-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
