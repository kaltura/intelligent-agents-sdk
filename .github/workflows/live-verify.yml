  live-verify-kickoff:
    name: 🔴🌐 Live verification (silent opening + kickoff + startup KPIs, chromium)
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *' ||
      ((github.event_name == 'merge_group' || contains(github.event.pull_request.labels.*.name, 'run-live-verify')) && needs.changes.outputs['kickoff'] == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: live-verify
    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install chromium
        run: npx playwright install --with-deps chromium

      - name: 🔴🌐 Provision 3 agents (silent+kickoff, Jinja2, Jinja2 <blank> + kickoff) → measure connect timing (3 runs each) → check startup KPIs per arm → cleanup
        id: live_verify_connect_timing
        env:
          AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
        run: |
          set -o pipefail
          node scripts/live-verify-connect-timing.mjs --env prod --compare jinja --runs 9 2>&1 | tee live-verify-connect-timing-output.log

      - name: 🔴🌐 Provision a silent-opening agent → run the kickoff scenario matrix → cleanup
        id: live_verify_kickoff
        if: always()
        env:
          AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
        run: |
          set -o pipefail
          node scripts/live-verify-kickoff.mjs --env prod 2>&1 | tee live-verify-kickoff-output.log

      - name: 📤 Upload live-verify-kickoff artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: live-verify-kickoff-artifacts
          path: |
            live-verify-artifacts/
            live-verify-connect-timing-output.log
            live-verify-kickoff-output.log
          retention-days: 90

      - name: 📝 Write job summary (startup KPIs first)
        if: always()
        run: |
          {
            echo "### 🔴🌐 Silent opening + kickoff — timing ${{ steps.live_verify_connect_timing.outcome }}, scenarios ${{ steps.live_verify_kickoff.outcome }}"
            echo
            echo "#### Startup KPIs (prod, headless Chromium, median ms per arm, cell = median ≤ budget result; a miss fails the timing step)"
            echo
            node -e '
              const fs = require("node:fs");
              const dir = "live-verify-artifacts";
              const files = fs.existsSync(dir) ? fs.readdirSync(dir).filter((f) => /^connect-timing-.*\.json$/.test(f)).sort() : [];
              if (!files.length) { console.log("No connect-timing report was written."); process.exit(0); }
              const arms = JSON.parse(fs.readFileSync(dir + "/" + files.at(-1), "utf8")).data?.compare?.arms ?? {};
              const names = Object.keys(arms);
              if (!names.length) { console.log("The connect-timing report has no per-arm results."); process.exit(0); }
              const labels = arms[names[0]].kpi.map((k) => k.label);
              console.log("| arm | runs | " + labels.join(" | ") + " |");
              console.log("|---|---|" + labels.map(() => "---|").join(""));
              for (const name of names) {
                const cells = arms[name].kpi.map((k) => (k.medianMs ?? "n/a") + " ≤ " + k.budgetMs + " " + k.status);
                console.log("| " + [name, arms[name].runs, ...cells].join(" | ") + " |");
              }
            ' 2>/dev/null || echo "Could not read the connect-timing report."
            echo
            echo "<details><summary>Full reports</summary>"
            echo
            for md in live-verify-artifacts/connect-timing-*.md live-verify-artifacts/kickoff-*.md; do
              [ -f "$md" ] && cat "$md" && echo
            done
            echo '```'
            tail -n 40 live-verify-kickoff-output.log 2>/dev/null || true
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

