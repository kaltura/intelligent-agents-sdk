  live-verify:
    name: 🔴 Live verification (smoke)
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *' ||
      ((github.event_name == 'merge_group' || contains(github.event.pull_request.labels.*.name, 'run-live-verify')) && needs.changes.outputs['smoke'] == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: live-verify
    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: 🔴 Session creation → one converse turn → cleanup, against the real Kaltura API
        id: live_verify
        env:
          AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
        run: |
          set -o pipefail
          node scripts/live-verify.mjs 2>&1 | tee live-verify-output.log

      - name: 📤 Upload live-verify artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: live-verify-artifacts
          path: |
            live-verify-artifacts/
            live-verify-output.log
          retention-days: 30

      - name: 📝 Write job summary
        if: always()
        run: |
          {
            echo "### 🔴 Live verification — ${{ steps.live_verify.outcome }}"
            echo
            echo '```'
            tail -n 40 live-verify-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  live-verify-capabilities:
    name: 🔴 Live verification (Knowledge/Application/Avatars/Lifecycle)
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *' ||
      ((github.event_name == 'merge_group' || contains(github.event.pull_request.labels.*.name, 'run-live-verify')) && needs.changes.outputs['capabilities'] == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: live-verify
    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: 🔴 Knowledge#listRecords, Application#getCustomPrompts, Avatars#listTemplates, Lifecycle create→get/list→match→update→delete, against the real Kaltura API
        id: live_verify_capabilities
        env:
          AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
        run: |
          set -o pipefail
          npm run live-verify:capabilities 2>&1 | tee live-verify-capabilities-output.log

      - name: 📤 Upload live-verify-capabilities artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: live-verify-capabilities-artifacts
          path: |
            live-verify-artifacts/
            live-verify-capabilities-output.log
          retention-days: 30

      - name: 📝 Write job summary
