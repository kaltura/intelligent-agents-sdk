name: Deploy docs site to GitHub Pages

on:
  push:
    branches: [gh-pages-src]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
      - run: npm ci
      # Also emits `SDK_TAG=vX.Y.Z` on stdout; the grep turns it into a step
      # output so the SDK checkout below is pinned to the exact tag the site
      # loads from jsDelivr (the build and the e2e tests import from that checkout).
      - id: sdk
        run: node scripts/check-sdk-pin-sync.mjs | tee /dev/stderr | grep '^SDK_TAG=' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: kaltura/intelligent-agents-sdk
          ref: ${{ steps.sdk.outputs.SDK_TAG }}
          path: .sdk-checkout
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          SDK_REPO_DIR: ${{ github.workspace }}/.sdk-checkout
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - run: npm run build
        env:
          ELEVENTY_PATH_PREFIX: ${{ steps.pages.outputs.base_path }}
          SDK_REPO_DIR: ${{ github.workspace }}/.sdk-checkout
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Remind about redeploying Nova
        run: |
          {
            echo "### Reminder: redeploy Nova if this changed page content"
            echo ""
            echo "Nova (the live avatar embedded on this site) is grounded on a snapshot of"
            echo "these docs taken at her own last redeploy, not on this site's live HTML — a"
            echo "page addition, rename, or content change here does not reach her until"
            echo "someone redeploys her separately."
            echo ""
            echo "If this deploy changed page content (not just styling), trigger"
            echo "kaltura/docs-site-avatar's **Redeploy Nova** workflow"
            echo "(Actions → Redeploy Nova → Run workflow)."
          } >> "$GITHUB_STEP_SUMMARY"
