name: CodeQL

# Advanced-setup CodeQL scan. It skips docs-only pushes/PRs, same as ci.yml's
# code jobs. Not a required status check (see branch protection): it is a
# security scan, not a merge gate.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full scan regardless of what changed.
    - cron: '30 1 * * 0'

permissions:
  contents: read

jobs:
  changes:
    name: 🔍 Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🔍 Does this push/PR touch anything other than docs?
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            code:
              - 'src/**'
              - 'test/**'
              - 'scripts/**'
              - 'tools/**'
              - 'examples/**'
              - 'package.json'
              - 'package-lock.json'
              - 'jsconfig.json'
              - '.eslintrc*'
              - 'eslint.config.*'
              - '.github/workflows/**'

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🔎 Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: 🔎 Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
