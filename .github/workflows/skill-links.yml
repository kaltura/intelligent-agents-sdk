name: Skill links

# Nightly: every docs-site page the app-builder skill names must still load.
# Catches site renames and removed pages. No secrets, no model calls.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill-links:
    name: 🔗 Check the app-builder skill's docs links
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: 🔗 Fetch every URL the skill names
        run: node tools/check-skill-links.mjs
