name: CI

# Runs on every push to main, every PR targeting main, and every merge-queue
# check run (merge_group) once a PR is enqueued to merge into main.
# Zero-dependency SDK, zero-devDependency test runner (node:test) — no real
# Kaltura credentials are used or required anywhere in this workflow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 🧪 Test suite
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: 🧪🩺 node --test + coverage + JUnit report (all suites, offline — fakes inject fetch/socket/RTC)
        run: npm run test:ci

      - name: 📤 Upload JUnit test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: test-results.junit.xml
          retention-days: 30

      - name: 📝 Write job summary
        if: always()
        run: |
          {
            echo "### 🧪 Test suite"
            echo
            if [ -f test-results.junit.xml ]; then
              grep -E '<!-- (tests|suites|pass|fail|cancelled|skipped|todo) ' test-results.junit.xml \
                | sed -E 's/^[[:space:]]*<!-- ([a-z]+) (.*) -->[[:space:]]*$/- **\1:** \2/'
            else
              echo "_No test-results.junit.xml produced — the run likely failed before reporting._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  constitution:
    name: 📜 Verify the SDK Constitution (agent_verify.mjs)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: 📜 Check every rule in SDK_CONSTITUTION.md (isolation, security, resiliency, performance, DX)
        id: verify
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee verify-output.log

      - name: 📝 Write job summary
        if: always()
        run: |
          {
            echo "### 📜 SDK Constitution verify — ${{ steps.verify.outcome }}"
            echo
            echo '```'
            tail -n 25 verify-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📜 Supplementary constitution checks (thresholds/contracts agent_verify.mjs can't reach)
        id: harness
        run: |
          set -o pipefail
          npm run harness:constitution 2>&1 | tee harness-output.log

      - name: 📝 Write job summary
        if: always()
        run: |
          {
            echo "### 📜 Constitution harness — ${{ steps.harness.outcome }}"
            echo
            echo '```'
            tail -n 25 harness-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  dx-gates:
    name: 🧹 Lint, typecheck, circular-import
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: 📦 Install devDependencies (eslint, madge, typescript)
        run: npm ci

      - name: 🧹 Lint
        id: lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint-output.log

      - name: 📝 Write lint job summary
        if: always()
        run: |
          {
            echo "### 🧹 Lint — ${{ steps.lint.outcome }}"
            echo
            echo '```'
            tail -n 30 lint-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🧾 Typecheck (tsc over JSDoc via jsconfig.json)
        id: typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck-output.log

      - name: 📝 Write typecheck job summary
        if: always()
        run: |
          {
            echo "### 🧾 Typecheck — ${{ steps.typecheck.outcome }}"
            echo
            echo '```'
            tail -n 30 typecheck-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🔄 Circular-import check (madge)
        id: circular
        run: |
          set -o pipefail
          npm run circular 2>&1 | tee circular-output.log

      - name: 📝 Write circular-import job summary
        if: always()
        run: |
          {
            echo "### 🔄 Circular-import check — ${{ steps.circular.outcome }}"
            echo
            echo '```'
            tail -n 30 circular-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  docs-gate:
    name: 📚 Check docs/code drift, secrets, and GFM hygiene (check-docs.mjs)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: 🔍 Run the docs CI gate (secrets, GFM, cross-doc links, SDK invariants)
        id: docs_gate
        run: |
          set -o pipefail
          npm run docs:gate 2>&1 | tee docs-gate-output.log

      - name: 📝 Write job summary
        if: always()
        run: |
          {
            echo "### 📚 Docs CI gate — ${{ steps.docs_gate.outcome }}"
            echo
            echo '```'
            tail -n 30 docs-gate-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  sast:
    name: 🛡️ SAST scan (semgrep)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🐍 Install semgrep
        run: pip install semgrep

      - name: 🛡️ Run the custom SAST ruleset (scripts/harness/semgrep-rules.yml)
        id: sast
        run: |
          set -o pipefail
          semgrep --config scripts/harness/semgrep-rules.yml --error src test tools scripts examples 2>&1 | tee sast-output.log

      - name: 📝 Write job summary
        if: always()
        run: |
          {
            echo "### 🛡️ SAST scan — ${{ steps.sast.outcome }}"
            echo
            echo '```'
            tail -n 30 sast-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
