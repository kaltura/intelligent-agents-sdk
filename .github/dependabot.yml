version: 2
updates:
  # This SDK ships zero runtime/dev dependencies, but its CI workflows pin
  # GitHub Actions by floating tag (@v4) — Dependabot keeps those current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # intelligent-agents-sdk-site is this same repo, checked out as a worktree
  # on gh-pages-src — Dependabot only ever reads config from a repo's default
  # branch, so this entry (not one committed under gh-pages-src) is what
  # covers the site's own Eleventy build deps.
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "gh-pages-src"
    schedule:
      interval: "weekly"
